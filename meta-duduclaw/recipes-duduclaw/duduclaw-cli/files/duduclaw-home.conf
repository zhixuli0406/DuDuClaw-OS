# Ownership of the gateway's /data trees (rootless gateway, 2026-10-15).
#
# NOT installed under /usr/lib/tmpfiles.d on purpose. It lives in
# /usr/share/duduclaw/tmpfiles.d/ and runs only when
# duduclaw-home-owner.service (and duduclaw-firstboot-provision.sh on first
# boot) name it explicitly. Two reasons:
#   1. The `Z` line must run while no uid-1000 process exists: before the
#      gateway and duduclaw-podman.service start, never during normal
#      operation. A file in /usr/lib/tmpfiles.d would also be applied by
#      systemd-tmpfiles-setup.service early in boot and by any ad-hoc
#      `systemd-tmpfiles --create` an operator runs on a live system.
#   2. Early in boot /data may not be mounted yet (LUKS /data is opened
#      later by duduclaw-data-open); a generic run would then create these
#      directories on the root filesystem underneath the mountpoint.
#
# Why tmpfiles and not `chown -R`: busybox chown (this image's chown, no
# CONFIG_DESKTOP, so no -h) follows symbolic links, and uid 1000 can plant
# `evil -> /etc/shadow` inside its own home. systemd-tmpfiles walks the tree
# by file descriptor with O_NOFOLLOW, never follows a symlink and refuses
# unsafe path transitions. `Z` changes owner and group only; modes are left
# as their creators set them. Hardlinks are the remaining hole (Z would
# change the inode a hardlink points at), which is why
# 50-duduclaw-protected-links.conf turns on fs.protected_hardlinks: uid 1000
# then cannot hardlink a root-owned file (for example
# /data/system/random-seed) into this tree.
#
# Type Path                              Mode UID      GID      Age Argument
d     /data/duduclaw                     0700 duduclaw duduclaw -
# The gateway's TMPDIR (duduclaw-gateway.service). Bind-mount sources for
# containers are created here because the gateway's own /tmp is private.
d     /data/duduclaw/tmp                 0700 duduclaw duduclaw -
Z     /data/duduclaw                     -    duduclaw duduclaw -
# Windows RemoteApp registry (DUDUCLAW_WINDOWS_VM_APPS_DIR, see
# duduclaw-firstboot's 20-home.conf). The gateway writes apps.toml here, the
# kiosk shell reads it. Owned by the gateway now that the gateway is not
# root; still 0755 because the kiosk user has to read it and it holds only
# display names and in-VM exe paths. Moved here from duduclaw-data-binds'
# tmpfiles.d (which only ships on the read-only-root edition) so the base
# edition gets it too.
d     /data/system                       0755 root     root     -
d     /data/system/windows-vm            0755 duduclaw duduclaw -
# apps.toml written by the root gateway of older images is root-owned; the
# same safe walk hands it to the gateway account.
Z     /data/system/windows-vm            -    duduclaw duduclaw -
