# meta-duduclaw — DuDuClaw OS product layer (Y1 Yocto bring-up).
#
# Lives in the MAIN repo root (not a separate repo, not under commercial/)
# per MAP-agent-native-os-2026-08.md decision ⑥ "同版同發＝單 repo＋OS 進主
# 版本流". This layer carries our distro policy, machine definitions, and
# (from Y1-2 onward) recipes for the five duduclaw-* Rust binaries.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "duduclaw"
BBFILE_PATTERN_duduclaw = "^${LAYERDIR}/"
BBFILE_PRIORITY_duduclaw = "10"

# LAYERSERIES_COMPAT declares against the Yocto Project RELEASE CODENAME
# ("wrynose" = 6.0 LTS). Note this repo is fetched as three separate repos
# (bitbake / openembedded-core / meta-yocto pinned to exact release commits)
# rather than a single "poky" combo-repo checkout — see
# meta-duduclaw/kas/duduclaw-os.yml for why (git.yoctoproject.org/poky's own
# "edison-6.0.x" tags turned out to point at an unrelated ~2012-era release,
# a real dead end hit and resolved during Y1-1 bring-up, verified 2026-08-25).
LAYERSERIES_COMPAT_duduclaw = "wrynose"

LAYERDEPENDS_duduclaw = "core"

LAYERVERSION_duduclaw = "1"
