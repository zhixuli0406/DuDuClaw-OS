# Rootless Podman store directories (2026-10-15). Private path, applied by
# duduclaw-podman.service's ExecStartPre (as root) after /data is mounted.
# Only `d` lines: the store holds files owned by subordinate uids and must
# never be chowned recursively.
#
# /data/system/containers is 0711 root so nobody can list it, while uid 1000
# can still reach its own subdirectory.
#
# Type Path                               Mode UID      GID      Age Argument
d     /data/system                        0755 root     root     -
d     /data/system/containers             0711 root     root     -
d     /data/system/containers/duduclaw    0700 duduclaw duduclaw -
