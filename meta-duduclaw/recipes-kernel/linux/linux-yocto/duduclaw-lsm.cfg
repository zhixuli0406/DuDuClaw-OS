# Landlock + Yama LSM enablement — WS-3/A5 (2026-09-01, DESIGN-os-security-
# line-2026-09.md §2 支柱一 A5 / G9: "六個 .cfg 全無 LSM 符號，Landlock 在
# Rust 端已 fail-closed 就緒但 kernel 沒開").
#
# Root cause: grepped every existing fragment in this directory
# (duduclaw-kvm/-container/-binder/-waydroid-net/-gaming/-n305/-8845hs/
# -live-squashfs.cfg) plus oe-core's unconditional netfilter baseline
# before writing this file — zero hits for `SECURITY_LANDLOCK`,
# `SECURITY_YAMA`, `SECURITY_LOCKDOWN_LSM`, or a `CONFIG_LSM=` line
# anywhere. `CONFIG_SECURITY` itself defaults to `n` upstream
# (security/Kconfig: "If you are unsure how to answer this question,
# answer N") and depends only on `SYSFS`+`MULTIUSER` (both already on for
# any general-purpose systemd distro) — with no fragment ever setting it,
# this kernel's whole LSM framework is off today, matching the design
# doc's own G9 finding.
#
# Sourced from kernel.org's own v6.18 tag (this kernel's pinned upstream
# version, matching duduclaw-container.cfg's own ".config" citation of
# "6.18.24+git"), read directly rather than recalled from memory:
# security/Kconfig, security/landlock/Kconfig, security/yama/Kconfig,
# security/lockdown/Kconfig, kernel/module/Kconfig.
#
# CONFIG_SECURITY=y: gate for the whole LSM framework (security/Kconfig).
#
# CONFIG_SECURITY_LANDLOCK=y: security/landlock/Kconfig `depends on
# SECURITY`, `select SECURITY_NETWORK`, `select SECURITY_PATH` — both
# auto-resolved by the kernel's own Kconfig select graph at the next
# fragment-merge/oldconfig step, not hand-set here, same convention this
# directory's other fragments already use for their own select-derived
# symbols. This is the userspace-facing half of what
# `crates/duduclaw-security` already gates on at the Rust layer (D5:
# "Landlock+seccomp 輕路線（Rust 端現貨）") — until this line lands, every
# landlock_create_ruleset()/landlock_restrict_self() call from that Rust
# code fails closed with ENOSYS (no such syscall support), which is safe
# but inert; this line is what makes it actually enforce anything.
#
# CONFIG_SECURITY_YAMA=y: security/yama/Kconfig `depends on SECURITY`,
# `default n`, no further select chain — ptrace-scope restriction, stacks
# cleanly with Landlock (Yama's own help text: "Like capabilities, this
# security module stacks with other LSMs").
#
# CONFIG_LSM="landlock,yama": security/landlock/Kconfig's own help text is
# explicit that turning on the bool alone is not sufficient — "you should
# also prepend 'landlock,' to the content of CONFIG_LSM to enable Landlock
# at boot time" — a direct, one-hand instruction from the symbol's own
# Kconfig help, not inferred. Explicitly set (not left to the upstream
# `default "landlock,lockdown,yama,loadpin,safesetid,...,ipe,bpf"` string
# in security/Kconfig's own `config LSM` — that default WOULD also work,
# since Kconfig's own doc says LSM names for modules that are not actually
# compiled in "will be ignored", but this project's own established
# convention is "one explicit source of truth, not a dependency-resolution
# assumption" (duduclaw-network-config.bb's own words) — trimmed to
# exactly the two LSMs this fragment actually compiles in, so the string
# never claims a capability (lockdown/loadpin/safesetid/ipe/bpf) this
# fragment does not build. Order matches the upstream default's own
# relative ordering for landlock-before-yama.
#
# DELIBERATELY NOT ADDED, contradicting this ticket's own literal task
# text ("CONFIG_SECURITY_LOCKDOWN_LSM=y") — a real design-assumption
# reversal, flagged rather than silently worked around either direction:
# security/lockdown/Kconfig's CONFIG_SECURITY_LOCKDOWN_LSM does
# `select MODULE_SIG if MODULES`, and this kernel's MODULES is
# unconditionally =y (every other fragment in this directory sets `=m`
# symbols throughout — DM_THIN_PROVISIONING, IPVLAN, IP_NF_NAT, etc. —
# module support is unquestionably on), so that `select` fires
# unconditionally the moment LOCKDOWN_LSM is turned on. kernel/module/
# Kconfig's own CONFIG_MODULE_SIG help text confirms the cost directly:
# "this option adds the OpenSSL development packages as a kernel BUILD
# dependency" plus (MODULE_SIG_ALL, default y once MODULE_SIG is on) an
# automatic sign-every-module step at `modules_install`. That is exactly
# the signing-infrastructure cost DESIGN-os-security-line-2026-09.md §2
# support-pillar-1 A5 itself already excludes from this P0 package, in so
# many words: "IMA/EVM/MODULE_SIG **不在此包**（代價高、依賴簽章基建，
# 歸 P2 拍板組）". The per-item task text asking for LOCKDOWN_LSM predates
# this specific dependency chain being verified (its own instruction was
# "讀 kernel 6.18 的 Kconfig 預設...一手確認" — this IS that verification,
# and it surfaces a direct conflict with the design doc's own P0/P2
# boundary one paragraph earlier in the same document). Resolved in favor
# of the design doc's explicit, named P0 exclusion rather than the
# per-item literal text: LOCKDOWN_LSM is left off this fragment, to be
# picked up together with the P2 MODULE_SIG/IMA/EVM signing-infrastructure
# decision, not fragmented across two unrelated tickets. Landlock and Yama
# alone (neither has a MODULE_SIG-shaped select chain) are unaffected by
# this deferral and ship in full this round.
CONFIG_SECURITY=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECURITY_YAMA=y
CONFIG_LSM="landlock,yama"
CONFIG_SECURITYFS=y
# SECURITYFS appended 2026-09-01 (SEC1 live-fire FAIL): LANDLOCK/YAMA/LSM
# were all confirmed present in the built .config, but /sys/kernel/security
# was empty -- the lsm listing file and landlock's own directory live on
# securityfs, which is a separate symbol this fragment initially missed.
# The LSMs were ACTIVE but unobservable; this adds the observation surface.
