# VER-RO (2026-09-02, DESIGN-os-trust-chain-2026-09.md "依賴鏈補記"): moved
# off /var/lib (root, about to become read-only ahead of dm-verity) onto
# /data/system/flatpak-verify. This unit ships SYSTEMD_AUTO_ENABLE=disable
# (see duduclaw-flatpak-kiosk-verify.bb's own header -- manual diagnostic
# only, never started at boot), so unlike the four always-relevant targets
# in recipes-duduclaw/duduclaw-data-binds/, a plain static Path= edit here
# is simpler and safer than a fifth bind-mount unit: this string is the
# ONLY place this path is spelled out (every consumer already goes through
# `flatpak --installation=verify`, never a hardcoded /var/lib/... literal
# -- grepped duduclaw-flatpak-kiosk-verify.sh/duduclaw-steam-kiosk-
# verify.sh before making this change), and the target path's own embedded
# hyphens would have made a var-lib-duduclaw\x2dflatpak\x2dverify.mount
# unit filename genuinely error-prone for zero behavioral benefit over
# editing this one line. The directory itself is provisioned by this
# recipe's own do_install (tmpfiles.d entry, same wave -- see
# duduclaw-flatpak-kiosk-verify.bb's own header).
[Installation "verify"]
Path=/data/system/flatpak-verify
