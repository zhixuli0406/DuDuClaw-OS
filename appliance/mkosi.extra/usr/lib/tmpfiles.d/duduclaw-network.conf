# D4a-2 (2026-08-23): the bind SOURCE for var-lib-iwd.mount.
#
# A .mount unit cannot create its own source directory, so something has to
# guarantee /data/network/iwd exists before iwd starts. tmpfiles is the right
# tool rather than duduclaw-firstboot-provision.sh (which the design doc
# originally suggested): that service self-disables after the first boot and
# is ordered in multi-user.target alongside the very units that need this
# directory, whereas systemd-tmpfiles-setup.service runs after local-fs.target
# (so /data is mounted) and before sysinit.target -- unconditionally, on every
# boot, idempotently. If an operator ever deletes the directory, the next boot
# restores it instead of leaving iwd permanently failed.
#
# Ownership/permissions match what iwd itself uses for /var/lib/iwd (0700
# root:root, verified in the VM spike): the passphrases inside are stored in
# CLEARTEXT by iwd -- see the design doc's honest-disclosure section. Nothing
# but root, and specifically not the duduclaw or duduclaw-kiosk users, can read
# this directory; the gateway reaches Wi-Fi through iwd's D-Bus API, which
# never returns a stored passphrase, not by reading these files.
#
# Type  Path              Mode UID  GID  Age Argument
d       /data/network     0755 root root -
d       /data/network/iwd 0700 root root -
