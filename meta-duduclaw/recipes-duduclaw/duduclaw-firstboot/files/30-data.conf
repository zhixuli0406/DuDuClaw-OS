# DuDuClaw OS /data -- systemd-repart definition (Y9-1, 2026-08-27).
#
# Ported from the Debian appliance line's appliance/mkosi.repart/30-data.conf
# (same repart.d(5) format -- mkosi.repart/*.conf files ARE systemd-repart
# definitions, mkosi just also copies them into the image at build time via
# ExtraTrees=mkosi.repart:/usr/lib/repart.d; this file plays the same
# runtime role here without an equivalent Yocto build-time consumer -- wic
# builds files/wic/duduclaw-data-bootdisk.wks.in's fixed-size /data
# partition independently, and this file is read ONLY at first real boot by
# duduclaw-firstboot-repart.sh's `systemd-repart --definitions=/usr/lib/repart.d`
# call).
#
# Type=linux-generic (the generic "Linux filesystem data" GPT type) matches
# files/wic/duduclaw-data-bootdisk.wks.in's own --part-type for the SAME
# partition -- this is what lets systemd-repart recognise the existing
# on-disk partition as a match-and-resize target instead of trying to
# create a second one. Label=duduclaw-data matches that wks line's own
# --label for the same reason (belt-and-braces on top of the type match).
#
# SizeMinBytes=512M is deliberately BELOW the wks's own build-time
# DUDUCLAW_DATA_SIZE_MB default (1024M, see
# classes/duduclaw-data-partflags.bbclass) -- on the golden/QEMU image
# itself the existing partition already exceeds this floor, so
# systemd-repart finds nothing to do (verified reasoning, not yet verified
# by an actual repart run against a golden image this round -- see the
# ticket's own handoff notes for exactly which layer of verification was
# reached). On real hardware with a bigger disk, Weight=1000 -- the only
# repart.d-managed partition on this line, since ESP/root are wic-built and
# have no repart.d definition of their own -- claims all space left over
# after the fixed-size ESP+root partitions, matching the Debian line's own
# "highest Weight= of any partition in this directory" reasoning even
# though this directory here only ever contains this one file.
[Partition]
Type=linux-generic
Label=duduclaw-data
SizeMinBytes=512M
Weight=1000
GrowFileSystem=yes
