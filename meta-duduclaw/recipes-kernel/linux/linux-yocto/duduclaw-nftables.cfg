# nftables kernel backend — WS-3/A4 (2026-09-01, DESIGN-os-security-line-
# 2026-09.md §2 支柱一 A4 / G10: "Yocto 線零防火牆").
#
# Root cause this closes: the `duduclaw-firewall` recipe (recipes-duduclaw/
# duduclaw-firewall/) ports the Debian appliance line's default-deny
# `/etc/nftables.conf` (`table inet filter { chain input { policy drop; ...
# } }`) onto this Yocto line, but the kernel's own nf_tables backend was
# never turned on here — checked, not assumed: this file's own sibling
# duduclaw-container.cfg (CP-2 wave-1 B1) only turns on the LEGACY iptables
# chain (`CONFIG_NETFILTER_XTABLES_LEGACY`, `CONFIG_IP_NF_*`) for Docker's
# own iptables-based bridge NAT, a completely different Kconfig subtree from
# nf_tables — grepped that file and oe-core's unconditional baseline
# (`features/netfilter/netfilter.cfg`, fetched from git.yoctoproject.org/
# yocto-kernel-cache at the yocto-6.18 branch this recipe's own SRCREV
# tracks) directly before writing this file: neither one sets
# CONFIG_NF_TABLES or any CONFIG_NFT_* symbol. An earlier draft of the
# design doc this ticket implements assumed NF_TABLES was already on via
# duduclaw-container.cfg -- that assumption does not hold, corrected here
# rather than silently worked around.
#
# Symbol selection: read net/netfilter/Kconfig, net/ipv4/netfilter/Kconfig,
# net/ipv6/netfilter/Kconfig, and net/netfilter/Makefile straight from
# kernel.org's own v6.18 tag (this kernel's pinned upstream version, per
# duduclaw-container.cfg's own ".config" citation: "6.18.24+git") rather
# than recalled from memory, to scope this fragment to exactly what
# `duduclaw-firewall`'s own ruleset (files/nftables.conf) actually uses --
# no NAT, no reject, no xtables-compat, no netdev-family tables:
#
#   CONFIG_NF_TABLES: core nf_tables engine the `nft` binary talks to over
#     netlink. `select`s NETFILTER_NETLINK + NET_CRC32C itself (Kconfig
#     `select`, not hand-set here -- the kernel's own fragment-merge/
#     oldconfig step resolves those automatically, same convention this
#     directory's other fragments already rely on for their own `select`-
#     derived symbols, e.g. duduclaw-container.cfg's own "already
#     satisfied" list). Built-in (=y), not module (=m): nftables.service
#     is `DefaultDependencies=no` / `Before=sysinit.target` (loads the
#     ruleset as early as possible, matching the Debian line's own
#     nftables.service contract, sourced from Debian's nftables 1.1.6-1
#     source package -- see duduclaw-firewall.bb's own header) — a
#     built-in backend has no module-autoload race at that boot point, a
#     `=m` one would.
#   CONFIG_NF_TABLES_INET: the ruleset's own `table inet filter` line
#     needs this specifically (plain `table ip`/`table ip6` would not).
#     `depends on IPV6` (net/netfilter/Kconfig) — this kernel's IPV6 is
#     assumed already on (the same ruleset's own `icmpv6` rules and this
#     distro's iwd/systemd-networkd stack both already assume a working
#     IPv6 stack; not independently re-confirmed against a live .config in
#     this ticket — flagged, not silently assumed rock-solid, verify via
#     the standard kernel-yocto fragment-audit warning on the next real
#     `bitbake linux-yocto` if this turns out wrong). `select`s
#     NF_TABLES_IPV4 + NF_TABLES_IPV6 itself, not hand-set here for the
#     same "let Kconfig's own select graph resolve it" reason as above.
#   CONFIG_NFT_CT: the ruleset's `ct state established,related accept` /
#     `ct state invalid drop` lines need the "ct" expression this symbol
#     adds (net/netfilter/Kconfig: `depends on NF_CONNTRACK`, already =y
#     via duduclaw-container.cfg's own bump). Built-in for the same early-
#     boot-race reason as NF_TABLES above.
#
# Deliberately NOT added (ruleset does not use any of these expressions,
# checked against files/nftables.conf directly, not guessed):
#   CONFIG_NFT_NAT / NFT_MASQ / NFT_REDIR — no NAT/masquerade/redirect
#     statement anywhere in the ruleset (Docker's own NAT already runs on
#     the separate legacy-iptables backend duduclaw-container.cfg turns
#     on; the two backends coexist independently, nf_tables' own default-
#     deny table never touches Docker's bridge NAT chains).
#   CONFIG_NFT_REJECT / NFT_REJECT_INET — the ruleset uses bare `policy
#     drop` (silent drop), never an explicit `reject` statement.
#   CONFIG_NFT_COMPAT — only needed to run legacy xtables (`iptables`)
#     match/target extensions THROUGH the nf_tables backend; this ruleset
#     is written in native nft syntax throughout, no xt_* extension calls.
#   CONFIG_NF_TABLES_NETDEV — the ruleset has no `table netdev` (ingress/
#     egress hooks), only `table inet` with input/forward/output hooks.
#
# `nft_meta`/`nft_payload` (the expressions behind the ruleset's `iif "lo"`
# and `tcp dport`/`udp dport`/`icmp type`/`icmpv6 type` matches) need no
# separate Kconfig symbol at all -- confirmed by reading net/netfilter/
# Makefile directly: both object files are unconditionally listed under
# `nf_tables-objs :=`, compiled in whenever CONFIG_NF_TABLES itself is,
# with no `obj-$(CONFIG_...)` gate of their own.
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=y
