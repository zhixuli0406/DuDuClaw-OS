# Installed by duduclaw-boot-splash as
# /usr/lib/systemd/system/duduclaw-kiosk.service.d/10-after-plymouth.conf.
#
# plymouthd holds DRM master on the boot display until it is told to quit.
# duduclaw-comp needs DRM master (through seatd) to start, so without this
# ordering the kiosk races the splash: comp fails to take the display, exits,
# and only comes up on a later Restart=always attempt.
#
# Ordering only, no Requires=/Wants=: plymouth-quit.service is pulled in by
# multi-user.target on its own, it is a oneshot with TimeoutSec=20 and an
# ExecStart prefixed "-" (plymouth 24.004.60 systemd-units/), so whether the
# splash quits cleanly, fails, or is not running at all (plymouth.enable=0,
# no plymouth installed), the kiosk still starts. Deliberately NOT ordered
# after plymouth-quit-wait.service: that unit has TimeoutSec=0 and would block
# the kiosk forever if plymouthd ever hung.
[Unit]
After=plymouth-quit.service
