# DuDuClaw OS — KVM host support for the self-contained Windows VM path
# (CP-2 wave-1 B1, 2026-08-30).
#
# Why: DESIGN-app-compat-layer-2026-08.md §2.3 路 B (Windows desktop apps
# with no vendor Linux path — Microsoft 365 / AutoCAD / 記帳ERP — get a
# self-packaged dockur/windows VM + FreeRDP 3 RemoteApp, architecture
# borrowed from WinApps/WinBoat but not their release cadence) needs
# /dev/kvm on the host: dockur/windows documents `--device=/dev/kvm` as
# required for anything beyond the slowest TCG software emulation
# (https://github.com/dockur/windows). TODO-compat-cp2-2026-08.md frames
# the QEMU verification environment as an intentional fail-closed
# exercise, not a real target: "QEMU 驗證環境無 nested KVM——bootstrap 的
# 「/dev/kvm 不存在→fail-closed 明訊息」正好可測" — this fragment's job
# is only to make /dev/kvm *possible* (kernel support compiled in), not
# to guarantee it exists everywhere; the CLI-level presence check (wave
# B3) is the actual gate, and QEMU is expected to keep failing it by
# design, same class of designed-degradation as duduclaw-binder.cfg
# built-in-not-module reasoning one file over in this same directory.
#
# Real target hardware (N305 / 8845HS mini-PCs, both duduclaw-
# genericx86-64 per duduclaw-n305.cfg / duduclaw-8845hs.cfg in this same
# directory) both support hardware virtualization as a baseline feature
# of current-generation silicon (Intel Alder Lake-N VT-x, AMD Hawk Point
# Zen 4 AMD-V) — not something to special-case per-SKU here.
#
# Symbol values — matches meta-virtualization's own upstream fragment
# verbatim, not guessed: this kernel already fetches
# git://git.yoctoproject.org/yocto-kernel-cache via SRC_URI's type=kmeta
# entry (see openembedded-core's linux-yocto_6.18.bb), and meta-
# virtualization's linux-yocto_virtualization.inc wires KVM support from
# exactly that repo's `features/kvm/qemu-kvm-enable.scc` (gated behind
# DISTRO_FEATURES "kvm", which this OS deliberately does not set — see
# meta-duduclaw/kas/duduclaw-os.yml's own DISTRO_FEATURES "virtualization"
# note for why meta-virtualization's DISTRO_FEATURES gates are left
# alone). Reading that .scc's own x86 leaf directly off the pinned
# yocto-6.18 branch (`git show yocto-6.18:features/kvm/qemu-kvm-x86.cfg`
# inside the checked-out git.yoctoproject.org.yocto-kernel-cache mirror
# this kernel's own do_fetch already populated) gives the exact upstream
# values:
#   CONFIG_KVM=m
#   CONFIG_KVM_INTEL=m
#   CONFIG_KVM_AMD=m
# This deliberately keeps CONFIG_KVM as =m rather than the =y this
# ticket's own task text loosely suggested — no evidence surfaced that
# built-in is required, and matching the ecosystem-standard fragment
# byte-for-byte is safer than hand-picking a stronger value. As modules,
# INTEL/AMD simply don't load on a platform whose vendor doesn't match
# (an AMD box never pulls in kvm_intel.ko and vice versa — this is the
# entire reason both ship as =m: "讓不相干平台不載", identical framing to
# duduclaw-binder.cfg's built-in-vs-module tradeoff write-up), and the
# shared "kvm" core module is an automatic dependency of whichever vendor
# module loads. =m costs real-hardware machines nothing once module
# loading is wired (dockur/windows setup flow, or a
# KERNEL_MODULE_AUTOLOAD entry) — and the QEMU fail-closed branch fires
# identically whether KVM core is =y or =m, since neither value produces
# a working /dev/kvm without genuine VT-x/AMD-V, nor (for the vendor
# submodules specifically) without them actually being loaded.
#
# Explicitly out of scope here: module autoload wiring (systemd-modules-
# load.d, or the compat bootstrap CLI running `modprobe kvm_intel` /
# `kvm_amd` ahead of its own /dev/kvm check) is image/CLI plumbing, not a
# kernel config concern — TODO-compat-cp2-2026-08.md's wave table scopes
# B1 to "kernel fragments" only; that plumbing is a B2/B3 follow-up,
# flagged here rather than silently assumed away.
#
# Unscoped (both duduclaw-qemux86-64 and duduclaw-genericx86-64), same
# reasoning as duduclaw-binder.cfg / duduclaw-live-squashfs.cfg in this
# directory: this is a general OS capability, not something scoped to
# real target hardware alone — the QEMU machine needs it too, to exercise
# the fail-closed verification path this wave's own acceptance criteria
# names explicitly.
CONFIG_KVM=m
CONFIG_KVM_INTEL=m
CONFIG_KVM_AMD=m
