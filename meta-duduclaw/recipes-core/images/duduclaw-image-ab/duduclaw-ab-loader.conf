# DuDuClaw OS — hardened systemd-boot loader.conf, A/B VARIANT (Y9-2,
# 2026-08-27).
#
# Byte-for-byte copy of ../duduclaw-image/duduclaw-loader.conf (see that
# file's own header for the full `timeout 0`/`editor no`/`console-mode
# keep` reasoning — unchanged here) EXCEPT the `default` line, which this
# ticket found could not stay `uki*` on the A/B image.
#
# WHY THIS HAD TO CHANGE: `default uki*` was written (Y7-2) against a
# TWO-entry world — the product UKI (always named literally `uki.efi`,
# uki.bbclass's own UKI_FILENAME default) and the rescue UKI
# (`duduclaw-os-rescue.efi`, deliberately excluded by the glob). The A/B
# image adds a THIRD, structurally different naming scheme:
# systemd-sysupdate-managed entries named
# `duduclaw-os_<version>[+tries[-left]].efi` (see
# recipes-duduclaw/duduclaw-ab-update/files/20-duduclaw-uki.transfer).
# `uki*` never matches any of those, so `default uki*` pins boot selection
# to the ORIGINAL factory entry FOREVER — verified live during this
# ticket: a real `device.update_apply` correctly wrote, labelled, and
# PARTUUID-patched a new `duduclaw-os_1.62.1+3-0.efi` entry with 3 tries
# left, systemd-sysupdate reported success, and the machine still
# rebooted straight back into the untouched `uki.efi` entry every time
# (`bootctl status` showing `Current Entry: uki.efi` — not a boot
# failure, a correct-but-wrong static default overriding boot-counting
# entirely). Forcing a `bootctl set-oneshot duduclaw-os_1.62.1.efi` proved
# the underlying A/B write WAS correct — the machine booted straight into
# slot B, `root-source` became the new partition, `/proc/cmdline` carried
# the device-side-patched PARTUUID — confirming this loader.conf line was
# the ONLY thing standing between a working write and a working boot.
#
# THE FIX: pair `duduclaw-image-ab.bb`'s own `UKI_FILENAME` override
# (`duduclaw-os_${DUDUCLAW_PLATFORM_VERSION}.efi` instead of uki.bbclass's
# bare `uki.efi` default) with `default duduclaw-os_*` here, so the
# FACTORY entry competes in the SAME namespace as every future
# sysupdate-managed entry from the very first boot, and boot-counting's
# own tries-left comparison — not a static pin — decides which one wins.
# `duduclaw-os_*` still never matches `duduclaw-os-rescue.efi` for the
# exact reason the original comment gives: the literal character right
# after `duduclaw-os` differs (`_` here vs `-` in the rescue filename), so
# 判準① (rescue never becomes the ambient default) still holds.
timeout 0
editor no
console-mode keep
default duduclaw-os_*
