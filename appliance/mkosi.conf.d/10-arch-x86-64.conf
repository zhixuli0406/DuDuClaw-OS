# Architecture-gated kernel package — x86-64 half.
#
# mkosi.conf.d/ drop-ins are parsed automatically alongside mkosi.conf
# ("`mkosi.conf.d/` is parsed in the same directory as `mkosi.conf` if it
# exists. Each directory and each file with the `.conf` extension in
# `mkosi.conf.d/` is parsed" — mkosi manual, "Configuration is parsed in
# the following order"). `[Match]` at the top of a file gates the whole
# file: "The `[Match]` section of a `mkosi.conf` file in a directory
# applies to the entire directory" — the same applies to a single
# drop-in file's own leading `[Match]` section (verified against the
# mkosi manual's `[Match]` section documentation, 2026-08).
#
# `Architecture=` in `[Match]` "Matches against the configured
# architecture. If this condition is used and no architecture has been
# explicitly configured yet, the host architecture is used." — since
# appliance/mkosi.conf's own `[Distribution] Architecture=x86-64` is
# parsed before this drop-in (mkosi.conf.d/ is parsed after mkosi.conf
# per the ordering above) and build.sh's `--architecture=` CLI override
# is parsed before configuration files, the match always sees the
# final resolved architecture, not a stale default.
#
# `Packages=` is a collection setting: "This option may be used multiple
# times in which case the specified package lists are combined" (mkosi
# manual, `[Content]` `Packages=`) — so this single line appends to, not
# replaces, the `Packages=` list already parsed from mkosi.conf.
#
# linux-image-amd64: confirmed present in Debian trixie, amd64-only
# (packages.debian.org, 2026-08) — this is the package already used
# before architecture parameterization existed.
#
# H1-ISO (2026-08-24, first real x86-64 bake): the four firmware/microcode
# packages below are gated HERE and not in the shared mkosi.conf
# Packages= list for a hard reason, not a style preference —
# `intel-microcode` and `amd64-microcode` do not exist as packages on
# arm64 at all (they are x86-only by definition: CPU microcode blobs for
# an ISA that doesn't apply to the arm64 local-smoke-build target), so
# adding them to the shared list would break every `APPLIANCE_ARCH=arm64`
# build with an unresolvable-package apt error. `firmware-misc-nonfree` /
# `firmware-amd-graphics` ARE `Architecture: all` and would technically
# resolve on arm64 too, but are kept arch-gated alongside the microcode
# pair anyway: they exist only to support the two real x86-64 mini-PC
# SKUs this image targets (Intel N305 / AMD 8845HS, both UEFI), and the
# arm64 path is Apple-Silicon-native QEMU smoke testing, not real
# hardware — shipping them there would be dead weight with no device to
# ever load them.
#
# Sizes measured via `apt-cache show` against a fresh `debian:trixie`
# container (`--platform linux/amd64`) with `non-free-firmware` enabled
# in `/etc/apt/sources.list.d/debian.sources` (the shared mkosi.conf
# already turns this repository component on — see its own
# `Repositories=main non-free-firmware` comment; these four packages are
# the first things in this image to actually draw from it):
#   intel-microcode        Installed-Size 20,908KiB (~20.4MiB) — CPU
#                           microcode updates for the N305 (Intel iGPU
#                           box). Silently inert on the 8845HS (AMD CPU);
#                           the kernel's microcode loader matches CPU
#                           vendor at boot and skips non-matching blobs,
#                           so one image can carry both vendors' updates.
#   amd64-microcode        Installed-Size 698KiB (~0.7MiB) — the AMD
#                           mirror of the above, for the 8845HS. Same
#                           inert-on-mismatch behavior on the N305.
#   firmware-misc-nonfree  Installed-Size 13,232KiB (~12.9MiB) — the
#                           general Debian firmware bundle; this is where
#                           the N305's i915 (Intel graphics) GuC/DMC
#                           firmware blobs live. Without it, i915 probes
#                           but the GPU never finishes init (DRM/KMS
#                           stays down), which is exactly the "comp's
#                           udev/DRM backend can't start" failure mode
#                           this package exists to close.
#   firmware-amd-graphics  Installed-Size 91,908KiB (~89.8MiB) — amdgpu
#                           firmware for the 8845HS's integrated Radeon
#                           GPU. Genuinely the biggest line item added
#                           this round (it bundles firmware for many AMD
#                           GPU generations, not just this one chip; no
#                           finer-grained Debian package exists to
#                           pick just the Phoenix/8845HS blobs out of it),
#                           but there is no working alternative: amdgpu
#                           is a firmware-dependent driver, unlike i915
#                           which degrades to a more limited but bootable
#                           mode without its firmware.
# Combined: ~123.7MiB installed on top of the existing image, x86-64
# build only. Not yet verified on the real N305/8845HS boxes (no
# hardware access in this round, see appliance/README.md's real-hardware
# gap list) — this closes the "known missing packages" half of the gap;
# the "does it actually bring up DRM on the real iGPU" half is a real-
# hardware verification item, tracked in docs/todo/TODO-H1-ISO-x86-installer.md.
[Match]
Architecture=x86-64

[Content]
Packages=linux-image-amd64
         intel-microcode
         amd64-microcode
         firmware-misc-nonfree
         firmware-amd-graphics
