# No TIOCSTI keystroke injection (rootless gateway, 2026-10-15).
#
# A root login shell runs `duduclaw` and the bundled AI CLIs as uid 1000
# through setpriv (profile.d function, duduclaw-runtime-exec). Interactive
# CLIs keep the shell's terminal, so their children (hooks, MCP servers
# started from config in the uid-1000 home) hold a descriptor of a tty
# whose session leader is the root shell. With legacy TIOCSTI any of them
# could push keystrokes into that root shell. 0 restricts TIOCSTI to
# CAP_SYS_ADMIN. duduclaw-rootless.cfg also builds the kernel with
# CONFIG_LEGACY_TIOCSTI=n so the default is already 0; this file keeps it
# that way if the kernel config ever changes.
dev.tty.legacy_tiocsti = 0
