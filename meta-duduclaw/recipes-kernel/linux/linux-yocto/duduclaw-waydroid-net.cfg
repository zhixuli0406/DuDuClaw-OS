# Waydroid LXC bridge NAT — CP-2 wave-2 debt clearance (2026-08-31).
#
# Root cause, from a live QEMU trace (`sh -x waydroid-net.sh start` on the
# appliance-test image, wave2e diagnosis run), not guessed: upstream
# waydroid-net.sh's start_iptables() runs
#
#   iptables -t mangle -A POSTROUTING -o waydroid0 -p udp -m udp --dport 68 \
#       -j CHECKSUM --checksum-fill
#
# (the standard virtualization-bridge DHCP checksum-fill rule — guests doing
# checksum offload otherwise hand the DHCP client a datagram with a bad
# checksum) and this kernel rejected it with "Extension CHECKSUM revision 0
# not supported, missing kernel module?" — the script's cleanup trap then
# tears the bridge back down, prints "Failed to setup waydroid-net." and
# exits 1, which is exactly the RuntimeError `waydroid session start`
# surfaced in the wave2-C run-4 PARTIAL verdict.
#
# The same trace cleared every OTHER dependency the script has, so this one
# symbol is the complete fix, not the first of several: ACCEPT/MASQUERADE
# targets and udp/tcp matches all applied cleanly (CONFIG_IP_NF_TARGET_
# MASQUERADE=m / CONFIG_IP_NF_MANGLE=m already set by duduclaw-container.cfg's
# docker chain), a full-text scan of the script found no other -j target
# beyond ACCEPT/MASQUERADE/CHECKSUM, and its dnsmasq user probe falls back
# to `nobody` (present) after lxc-dnsmasq/dnsmasq (absent) — verified live.
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=m
