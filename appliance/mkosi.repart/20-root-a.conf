# Root slot A — the OS tree mkosi actually builds gets copied here
# (CopyFiles=/:/ copies the whole build root into the partition).
#
# ReadOnly=yes sets the GPT read-only partition attribute; the OS mounts
# the filesystem itself with `ro` too (see mkosi.extra/etc/fstab) — the
# read-only root + separate /data split is the precondition for atomic A/B
# updates and factory reset (base image damage never touches user data).
#
# Fixed Min==Max size so slot A and slot B (21-root-b.conf) are always
# identical size — required for systemd-sysupdate to dd a slot-A-sized
# update payload into slot B (and vice versa on the next update) without a
# resize step.
#
# dm-verity (Verity=hash/signature on a paired partition) is a deliberate
# v1 gap — see appliance/README.md "known open points". Read-only mount +
# GPT read-only attribute is the v1 integrity story; verity is a
# documented v2 hardening candidate.
[Partition]
# Generic "root" (not root-x86-64): repart resolves it to the arch-specific
# type for the build architecture (root-arm64 on an arm64 build, root-x86-64
# on x86-64), so Discoverable-Partitions-Spec root auto-discovery works on
# the machine actually running. Hardcoding root-x86-64 typed the arm64
# image's root as x86-64, which DPS on an arm64 system would never match.
Type=root
# The GPT partition LABEL is systemd-sysupdate's version ledger, not a
# human-friendly slot name (H3a, 2026-08-23). sysupdate's partition target
# matches installed instances with `MatchPattern=duduclaw-os_@v` against the
# label and writes the new version string into the label of whichever slot it
# just populated. The old `duduclaw-root-a` matched no pattern, so
# `systemd-sysupdate list` reported ZERO installed instances and could not
# compute an update at all — the counterpart to the `_empty` marker slot B
# now carries (see 21-root-b.conf).
#
# The version is spelled out rather than derived: systemd-repart has no
# specifier expansion for Label= (checked against repart.d(5) v257), and
# mkosi passes these files through to systemd-repart untouched. build.sh
# asserts this string agrees with mkosi.version after every build, so the
# two cannot drift silently — that check is the reason hardcoding is
# acceptable here.
#
# A hardcoded version here would be dangerous if systemd-repart re-applied
# it to a live disk, because duduclaw-firstboot-repart.service DOES re-run
# on every slot switch: its `.repart-grown` stamp lives on the root
# partition, so a freshly written slot has no stamp and re-runs the pass.
# On a machine already updated to 0.2.0 that would mean the 0.2.0 image's
# copy of this file, saying `Label=duduclaw-os_0.2.0`, meeting a disk whose
# slot A still holds 0.1.0 and whose slot B (the running one) holds 0.2.0 —
# if labels were rewritten, the running slot would be relabelled `_empty`
# and the next update would overwrite the running system.
# THIS DOES NOT HAPPEN, and it was checked rather than reasoned about:
# a scratch disk built with A=`duduclaw-os_0.1.0` / B=`duduclaw-os_0.2.0`,
# re-run through `systemd-repart --dry-run=no` with definitions naming
# A=`duduclaw-os_0.2.0` / B=`_empty`, reports "No changes." and leaves both
# labels and both attribute words untouched. repart only assigns a label to
# a partition it is creating, or one whose label is empty.
#
# Not a boot-selection input any more: since mkosi.conf's KernelCommandLine
# now bakes `root=PARTUUID=<slot A>` into the UKI, systemd-gpt-auto-generator
# skips root discovery entirely, so nothing compares these labels to decide
# what to mount. That matters, because under gpt-auto the previous labels
# were actively wrong — `duduclaw-root-b` sorts ABOVE `duduclaw-root-a` under
# strverscmp_improved, i.e. the empty slot was the preferred root and only
# slot B's NoAuto attribute was holding the boot together.
Label=duduclaw-os_0.1.0
Format=ext4
CopyFiles=/:/
# 4G -> 5G (2026-08-20, Shell-S2 kiosk wave): the gpui-shell kiosk additions
# (mesa-vulkan-drivers incl. libLLVM, fonts-noto-cjk, fonts-noto-color-emoji,
# login, the duduclaw-shell binary) overflowed the 4G root at mkfs populate
# time ("No space left on device while populating file system"). Clean root
# was ~3.0G; the additions are ~0.6G. Both root partitions move together —
# A/B slots must stay identical for sysupdate.
SizeMinBytes=5G
SizeMaxBytes=5G
# ReadOnly is temporarily OFF (2026-08-18): a read-only root drops systemd
# into emergency mode at boot because /var (journald, tmpfiles, docker's
# data-root) and /etc/machine-id are not writable. Booting writable first
# validates the whole kernel→systemd→gateway→multi-user pipeline; the
# read-only-root hardening (writable /var + docker data-root redirected onto
# the /data partition, or a volatile-/var overlay) is the next iteration.
ReadOnly=no
