# Yama ptrace scope (rootless gateway, 2026-10-15).
#
# Every AI employee runs as the same uid as the gateway. With
# ptrace_scope=1 ("restricted"), a process can only ptrace its own
# descendants, so an AI CLI cannot attach to the gateway (its ancestor) or
# to duduclaw-podman.service (a different process tree), and cannot use
# /proc/<pid>/mem or process_vm_writev against them either, since those go
# through the same check. duduclaw-sysd's planned caller check (accept a
# request only from the gateway's main PID) depends on that.
#
# 1 is already the kernel default when Yama is built in (duduclaw-lsm.cfg:
# CONFIG_SECURITY_YAMA=y, CONFIG_LSM="landlock,yama"). Set explicitly so a
# package's sysctl.d file cannot quietly lower it to 0.
kernel.yama.ptrace_scope = 1
