# The kiosk user's home on /data (2026-10-15). Applied once, by
# duduclaw-firstboot-provision.sh, which used to run `chown -R` here.
# systemd-tmpfiles walks by file descriptor and never follows a symlink;
# busybox chown (this image's chown) does follow them. Private path
# (/usr/share/duduclaw/tmpfiles.d), not /usr/lib/tmpfiles.d, so a generic
# boot-time or ad-hoc tmpfiles run never touches this tree; see
# duduclaw-cli's duduclaw-home.conf header for the full reasoning.
#
# `d` with mode "-": created 0755 when missing, an existing mode is left
# alone (the old `mkdir -p` behaviour). `Z` changes owner/group only.
#
# Type Path                  Mode UID            GID            Age Argument
d     /data/duduclaw-kiosk   -    duduclaw-kiosk duduclaw-kiosk -
Z     /data/duduclaw-kiosk   -    duduclaw-kiosk duduclaw-kiosk -
