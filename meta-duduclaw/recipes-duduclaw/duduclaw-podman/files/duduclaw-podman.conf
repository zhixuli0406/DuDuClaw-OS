# Parent directory of the rootless Podman API socket
# (duduclaw-podman.socket). Created during sysinit, before sockets start,
# so systemd finds it and does not create it root-owned. Its parent,
# /run/duduclaw-gateway, comes from duduclaw-cli's duduclaw-gateway.conf.
#
# Type Path                           Mode UID      GID      Age Argument
d     /run/duduclaw-gateway/podman    0700 duduclaw duduclaw -
