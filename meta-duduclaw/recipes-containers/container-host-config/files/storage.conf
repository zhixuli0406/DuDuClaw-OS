# containers/storage configuration for DuDuClaw OS (replaces
# meta-virtualization's container-host-config storage.conf, which uses the
# vfs driver; see this directory's .bbappend for why).
#
# The only engine user on this OS is rootless Podman running as the gateway
# account (duduclaw-podman.service, uid 1000). Its store goes to
# rootless_storage_path: $USER expands to "duduclaw", giving
# /data/system/containers/duduclaw, a 0700 directory inside the root-owned
# 0711 /data/system/containers. It is NOT under the gateway home on
# purpose: files in the store belong to subordinate uids (100000+), and the
# boot-time ownership fix over /data/duduclaw (duduclaw-home-owner.service)
# must never touch them. Being on /data, the store survives A/B updates.
#
# graphroot/runroot are root's defaults and stay unused (root does not run
# Podman locally here; root shells talk to the gateway's API socket through
# CONTAINER_HOST, see duduclaw-podman's profile.d file).
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
rootless_storage_path = "/data/system/containers/$USER"

[storage.options]
additionalimagestores = [
]
pull_options = {enable_partial_images = "false", use_hard_links = "false", ostree_repos=""}

# Kernel overlayfs inside the user namespace (Linux >= 5.11; this image
# runs 6.18), no mount_program, so fuse-overlayfs is not used. nodev: an
# image layer cannot bring device nodes along.
[storage.options.overlay]
mountopt = "nodev"
