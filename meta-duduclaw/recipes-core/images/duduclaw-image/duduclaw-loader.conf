# DuDuClaw OS — hardened systemd-boot loader.conf (Entry B / DRAFT-no-linux-
# surface-2026-08.md item 4, realized on the Yocto line by this ticket).
#
# timeout 0
#   Menu hidden on a normal, healthy boot — 判準①, no boot-time "this is
#   Linux" surface for the common case. Matches the value already chosen
#   (but never enforced, since no loader.conf existed) for the Debian
#   appliance line's own item-4 decision.
#
# editor no
#   REQUIRED alongside `timeout 0` — this is a real gap this ticket found,
#   not a value carried over from anywhere else. Verified 2026-08-26
#   against systemd's own loader.conf(5) source (raw.githubusercontent.com/
#   systemd/systemd, main branch, man/loader.conf.xml — fetched directly,
#   not guessed from training data): "Unless menu-disabled is used, the
#   menu can be shown by pressing and holding a key." I.e. `timeout 0`
#   alone does NOT remove the physical-key escape hatch — which is exactly
#   the mechanism Entry B's rescue-entry SELECTION deliberately relies on
#   (see meta-duduclaw/classes/duduclaw-rescue-boot.bbclass). But without
#   `editor no`, that SAME key-press also reaches systemd-boot's built-in
#   kernel-cmdline EDITOR: anyone with physical keyboard access could
#   reveal the menu and rewrite ANY UKI's cmdline (e.g. inject
#   `init=/bin/sh` / `rd.break`) to reach an instant, completely unaudited
#   root shell — bypassing both Entry B's restricted `duduclaw-rescue`
#   identity model (commercial/docs/DESIGN-maintenance-mode-2026-08.md
#   §3.3) AND the Q1 root-lock invariant. This gap exists on ANY stock
#   systemd-boot install with `timeout 0` and no `editor no` line,
#   regardless of whether a rescue entry is ever added — it was simply
#   never caught before because no loader.conf was ever shipped on this
#   line at all (wic's own generated default never writes an `editor`
#   line either). `editor no` closes it while leaving menu SELECTION (no
#   cmdline rewriting) reachable by key-press.
#
# console-mode keep
#   Do not touch whatever video mode the firmware left set — matches the
#   appliance line's own ESP evidence (commercial/docs/DESIGN-ab-update-
#   rollback-2026-08.md's first-hand `#console-mode keep` finding), kept
#   for parity even though this line's default verification path is a
#   serial console.
#
# default uki*
#   Once meta-duduclaw/classes/duduclaw-rescue-boot.bbclass adds a SECOND
#   UKI (duduclaw-os-rescue.efi) to /EFI/Linux/ alongside the product UKI
#   (uki.efi, from uki.bbclass's own UKI_FILENAME default), systemd-boot's
#   own tie-break rule for "which entry auto-boots when no explicit
#   choice is made" is not something this ticket could fully pin down
#   from upstream docs alone (systemd's Boot Loader Specification and
#   loader.conf(5) both describe entry SORTING for menu display, but
#   neither documents the exact automatic-boot fallback when `default` is
#   absent and no @saved EFI variable exists yet — verified 2026-08-26 by
#   reading both source documents directly, not guessed). Rather than
#   gamble on filename sort order silently picking the rescue UKI as the
#   real default on some future systemd-boot version (which would be a
#   catastrophic regression of 判準① — rescue becoming the NORMAL boot
#   path), this pins the default explicitly. The glob (not a literal
#   `uki.efi`) hedges against the one part that IS still unconfirmed —
#   whether a Type #2 entry's `id` the `default` directive matches against
#   includes the `.efi` suffix or not (loader.conf(5)'s own worked
#   example only shows this for Type #1 `.conf` entries) — `uki*` matches
#   either spelling while provably never matching
#   `duduclaw-os-rescue.efi`.
timeout 0
editor no
console-mode keep
default uki*
