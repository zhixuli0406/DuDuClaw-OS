# Kernel modules preloaded for rootless Podman (2026-10-15).
# Measured on the first real-image run (lsmod diff, V8 in
# wiki/reports/rootless-verification/2026-10-15.md): the first bridge
# container autoloaded nft_chain_nat, now listed. Still provisional for
# setups that run more than the sandbox.
#
# Only the nf_tables expressions netavark's nftables driver uses for
# `--network bridge` inside the rootless network namespace (NAT,
# masquerade, fib lookups for port forwarding). Built as modules by
# duduclaw-rootless.cfg; preloaded because autoloading from inside a
# rootless user namespace is not something to rely on. No legacy x_tables
# (ip_tables, iptable_*, xt_*, nft_compat): the containers that run
# iptables themselves (computer use) get those by autoload or not at all,
# and a name the kernel lacks makes systemd-modules-load fail. tun is built
# in (CONFIG_TUN=y).
nft_chain_nat
nft_nat
nft_masq
nft_fib_inet
