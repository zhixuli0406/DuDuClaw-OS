# DuDuClaw OS: the SSH host key lives on /data (2026-10-16).
#
# Upstream dropbearkey.service writes an RSA key to /etc/dropbear, which is
# read-only on the desktop edition (duduclaw-ro-root.inc does not use
# oe-core's read-only-rootfs feature, so oe-core's move of the key to
# /var/lib/dropbear never applies here). Both editions now keep one ed25519
# key in /data/system/dropbear (root 0700), which survives reboots and A/B
# updates, so the fingerprint a technician checked stays the same; a
# factory reset deletes it (duduclaw-factory-reset.sh), so the next owner
# gets a new one.
#
# The empty ConditionPathExists= drops both upstream conditions (they look
# at /etc/dropbear and /var/lib/dropbear); the new one skips generation
# once the key exists. mkdir -m only applies to a directory it creates, so
# chmod puts an existing /data/system/dropbear back to 0700 too.
# duduclaw-sysd starts this unit synchronously before
# it opens a window and reads the fingerprint back with `dropbearkey -y`,
# so the first window does not wait for the first connection to make the
# key. dropbearkey writes a temporary file and links it into place, so an
# interrupted run does not leave a half-written key behind.
[Unit]
ConditionPathExists=
ConditionPathExists=!/data/system/dropbear/dropbear_ed25519_host_key
RequiresMountsFor=/data

[Service]
Environment=
EnvironmentFile=
ExecStart=
ExecStart=@BASE_BINDIR@/mkdir -p -m 0700 /data/system/dropbear
ExecStart=@BASE_BINDIR@/chmod 0700 /data/system/dropbear
ExecStart=@SBINDIR@/dropbearkey -t ed25519 -f /data/system/dropbear/dropbear_ed25519_host_key
