# Installed by duduclaw-boot-splash as
# /usr/lib/systemd/system/duduclaw-rescue-shell@.service.d/10-quit-plymouth.conf.
#
# The rescue UKI boots with plymouth.enable=0 (duduclaw-image-splash.inc), so
# normally no splash is running here. This is the second line of defence for
# any other way into duduclaw-rescue.target while a splash is up: that target
# Conflicts= multi-user.target, so plymouth-quit.service never runs and the
# splash would sit on top of the tty1 rescue shell indefinitely. systemd's own
# rescue.service and emergency.service do the same `plymouth quit` for the
# same reason. "-" = a missing plymouth binary or daemon is not an error.
[Unit]
After=plymouth-start.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit
