# Y18 (2026-08-28) — squashfs support for the live installer ISO.
#
# Root cause found via a live interactive probe of a running QEMU cdrom-mode
# boot (appliance/.vm/y18-serial-cdrom3-full.log): duduclaw-image-live-
# initramfs's init-live.sh correctly found and loop-mounted rootfs.img (a
# squashfs image, per duduclaw-image-live.bb's LIVE_ROOTFS_TYPE=squashfs),
# but the mount itself failed ("mount: mounting /dev/loop0 on /rootfs
# failed: Invalid argument"). `cat /proc/filesystems` from the live shell
# confirmed squashfs is absent from the kernel entirely (only ext2/ext3/
# ext4/vfat/msdos/iso9660/nfs/nfs4/cifs/smb3/btrfs registered) — this
# kernel config has never needed squashfs before (production A/B root is
# ext4), and `modprobe squashfs` failed too (`/lib/modules`: No such file
# or directory — the live initramfs carries no kernel modules at all, so
# even a =m config would not have helped without also installing
# kernel-module-squashfs into duduclaw-image-live-initramfs.bb).
#
# Built in (=y), not a module: the live initramfs is deliberately minimal
# (see duduclaw-image-live-initramfs.bb) and has no /lib/modules tree —
# building squashfs as a module would require also packaging
# kernel-module-squashfs plus a matching modprobe call in init-live.sh
# (out of tree, oe-core upstream code we don't own) for zero benefit, since
# this is the one filesystem type the live boot path cannot function
# without.
#
# All common decompressors enabled rather than guessing which one
# oe-core's `oe_mksquashfs` (image_types.bbclass) actually produced:
# `IMAGE_CMD:squashfs = "oe_mksquashfs '' ${EXTRA_IMAGECMD}"` passes an
# empty compressor argument, meaning mksquashfs falls back to whatever its
# own build-time default is (typically gzip/zlib, but not contractually
# guaranteed across squashfs-tools versions) — enabling the full set is
# cheap in kernel size/build time and avoids a second wrong-guess rebuild
# round.
#
# Unscoped (applies to both duduclaw-qemux86-64 and duduclaw-genericx86-64,
# unlike the N305/8845HS/gaming fragments in this same directory which are
# real-hardware-only): the live installer ISO must boot on real target
# hardware, not just QEMU bring-up, so both machines need this.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_FILE_CACHE=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_LZ4=y
CONFIG_SQUASHFS_LZO=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
