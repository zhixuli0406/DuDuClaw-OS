# kas build config overlay — DuDuClaw OS Y2-2, real-hardware machine.
#
# Composes on top of duduclaw-os.yml via kas's `header.includes` (kas 5.5,
# config format version 23 — confirmed present in the builder container via
# `kas --version`) rather than duplicating the repo pin table: everything
# about *which upstream commits* (bitbake/openembedded-core/meta-yocto) is
# defined exactly once, in duduclaw-os.yml. This file only overrides what
# actually differs for the real-hardware target — the MACHINE.
#
# TMPDIR/DL_DIR/SSTATE_DIR are inherited unchanged from duduclaw-os.yml's
# local_conf_header, which is deliberate: duduclaw-qemux86-64 and
# duduclaw-genericx86-64 share the same TUNE (x86-64-v3), so building both
# from the same TMPDIR/build dir gets near-total sstate reuse for every
# non-machine-tied package (see duduclaw-os.yml's TMPDIR comment for the
# verification). Building this target REWRITES build/conf/local.conf and
# bblayers.conf in place (kas's normal behavior, same build dir as the base
# config) — it does not corrupt or lose the qemu machine's sstate, only its
# MACHINE selection, which the next `kas build duduclaw-os.yml` invocation
# restores.
#
# Usage (from the Docker builder container, cwd = /workspace = repo root):
#   kas build meta-duduclaw/kas/duduclaw-os-genericx86-64.yml
#
# A5 (2026-08-30) — meta-virtualization + the meta-networking/meta-
# filesystems layer additions for Waydroid (see duduclaw-os.yml's own
# header comment for the full pin/rationale trail) needed NO edit here:
# `repos:` is not overridden by this file at all, so `header.includes`
# already merges the base config's full repo/layer table into this
# machine's build — both kas ymls pick up the new layers from the single
# edit in duduclaw-os.yml. Verified, not assumed: this file's own body
# below has never had a `repos:` key since it was written (Y2-2).

header:
  version: 14
  includes:
    - meta-duduclaw/kas/duduclaw-os.yml

# --- target 回填記錄 (Y11-3, 2026-08-27) ------------------------------
# Same nine-wave-stale finding as duduclaw-os.yml's own target comment
# (full rationale there — this file's `target:` is a separate kas key that
# does NOT inherit the base config's list value via `header.includes`, so
# it silently drifted right alongside the qemux86-64 one and needed its
# own fix). Bumped to `duduclaw-image-flatpak` for the same interim-fix
# reason. Real evidence this exact image has already been built for THIS
# machine, not just qemux86-64: commercial/docs/TODO-agent-first-os-2026-08.md
# Y6-3 "genericx86-64 燒錄包" round shipped a real
# `duduclaw-os-genericx86-64.wic` (10,856,438,784 bytes, sha256 logged
# there) from `bitbake duduclaw-image-flatpak` on this machine, 7740/7740
# tasks succeeded, do_rootfs/do_image_wic/do_image_complete all passed —
# this is not a first-time-for-this-machine guess.

machine: duduclaw-genericx86-64

target:
  - duduclaw-image-flatpak
