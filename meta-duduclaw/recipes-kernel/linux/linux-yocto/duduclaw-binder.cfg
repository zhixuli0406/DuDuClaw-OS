# DuDuClaw OS — Android binder IPC support for Waydroid (CP-1 A1, 2026-08-30).
#
# Root cause: CP-0's Waydroid PoC (2026-08-21, Lima/vz Ubuntu VM) recorded
# "值班機 image 內核需啟用 binder" as a follow-up, and CP-1's own G4 live
# QEMU probe on 2026-08-30 confirmed the gap directly — `modprobe
# binder_linux` fails with "module not found" on 6.18.24-yocto-standard,
# because this kernel config has never had any binder symbol enabled
# before (Waydroid/LINE is the first thing in this OS that needs it).
# See commercial/docs/DESIGN-app-compat-layer-2026-08.md §2.4 for the
# Waydroid design and CP-0/CP-1 findings, and TODO-compat-cp1-2026-08.md
# item A1 for this ticket.
#
# Standard kernel-yocto .cfg fragment mechanism — see duduclaw-n305.cfg
# header for how find_sccs() in kernel-yocto.bbclass merges these.
#
# Built in (=y), not module: Waydroid's own documentation
# (https://docs.waydro.id/usage/host-requirements) requires
# CONFIG_ANDROID_BINDER_IPC and CONFIG_ANDROID_BINDERFS to be enabled and
# specifically recommends binderfs (the "modern" mount-based scheme,
# `/dev/binderfs`) over the legacy fixed-`/dev` binder device nodes —
# binderfs is what lets Waydroid's own init tooling create and tear down
# binder devices per-container without a kernel command-line or module
# argument. Built-in avoids the same "no /lib/modules tree at boot" class
# of problem duduclaw-live-squashfs.cfg's header documents for the live
# initramfs — binder is needed by a userspace session service, not
# something we control the modprobe ordering for, so =y removes an entire
# failure mode rather than trading it for a modprobe-at-the-right-time
# dependency.
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_ANDROID_BINDERFS=y

# Deliberately empty: this is the CONFIG_ANDROID_BINDER_DEVICES string
# that, under the legacy (non-binderfs) scheme, statically names fixed
# device nodes ("binder,hwbinder,vndbinder") created at boot. Waydroid's
# binderfs path creates devices dynamically at container start instead
# (mounted under /dev/binderfs, not /dev), so a static list here would be
# both unused and, per Waydroid's docs, the thing binderfs exists to
# replace. Left empty rather than omitted so the intent (deliberately not
# using the static scheme) is explicit in the fragment, not just absent.
CONFIG_ANDROID_BINDER_DEVICES=""

# Unscoped (applies to both duduclaw-qemux86-64 and duduclaw-genericx86-64),
# unlike the N305/8845HS/gaming fragments in this same directory which are
# real-hardware-only: the G4 probe that found this gap ran on
# duduclaw-qemux86-64, and Waydroid is a general OS capability (CP-1's own
# QEMU integration bake needs binderfs to mount), not something scoped to
# real target hardware — same reasoning as duduclaw-live-squashfs.cfg.
