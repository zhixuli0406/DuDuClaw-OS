# Rootless Podman store directories (2026-10-15). In /usr/lib/tmpfiles.d
# since the first real-image run (F1): systemd-tmpfiles-setup creates them
# at boot, after local-fs.target (so after /data is mounted), the same way
# duduclaw-data-binds creates the other /data/system directories.
# duduclaw-podman.service's ExecStartPre applies this file again, which
# recreates the store after a factory reset removed it later in the boot.
# Only `d` lines: the store holds files owned by subordinate uids and must
# never be chowned recursively.
#
# /data/system/containers is 0711 root so nobody can list it, while uid 1000
# can still reach its own subdirectory. .cache is podman's XDG_CACHE_HOME
# (the unit keeps the gateway home read-only).
#
# Type Path                                     Mode UID      GID      Age Argument
d     /data/system                              0755 root     root     -
d     /data/system/containers                   0711 root     root     -
d     /data/system/containers/duduclaw          0700 duduclaw duduclaw -
d     /data/system/containers/duduclaw/.cache   0700 duduclaw duduclaw -
