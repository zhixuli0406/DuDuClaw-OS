# nftables.service drop-in, shipped by duduclaw-podman (2026-10-15).
#
# nftables.conf starts with `flush ruleset`, so every (re)load empties the
# duduclaw_podman_egress chain that duduclaw-podman.service filled. With
# KillMode=process the containers and their pasta processes outlive a
# restart of the podman service, so they must not sit unguarded until
# something restarts it. Re-running the guard right after the ruleset is
# loaded, inside the same nftables.service job, shrinks the unguarded
# window to the moment between `flush ruleset` and this ExecStartPost /
# ExecReload line (it does not remove it) for `systemctl
# start|restart|reload nftables`. A bare `nft -f` by hand leaves the chain
# empty until the podman unit restarts.
#
# --if-present: before Podman has ever started (the normal case at boot,
# when this unit runs in sysinit) there is no cgroup to guard and the guard
# exits 0. No "-" prefix: if the cgroup exists and the rule cannot be
# loaded, nftables.service fails, which is visible and also keeps
# duduclaw-podman.service (Requires=nftables.service) from starting again.
[Service]
ExecStartPost=/usr/libexec/duduclaw/podman-egress-guard --if-present
ExecReload=/usr/libexec/duduclaw/podman-egress-guard --if-present
