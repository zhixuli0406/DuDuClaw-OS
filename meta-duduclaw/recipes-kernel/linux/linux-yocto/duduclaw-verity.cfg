# dm-verity kernel enablement — VER-V (2026-09-02, DESIGN-os-trust-chain-
# 2026-09.md §3 + 2026-09-02 拍板紀錄 "T4 修正案"/"依賴鏈補記").
#
# Sourced one-hand from the ACTUAL pinned kernel source, not recalled from
# memory: the linux-yocto bare git mirror cached at
# /yocto-cache/downloads/git2/git.yoctoproject.org.linux-yocto.git inside
# the duduclaw-yocto builder container, read at this project's own pinned
# SRCREV_machine:qemux86-64 (also the effective SRCREV_machine default for
# duduclaw-genericx86-64 — meta-duduclaw/recipes-kernel/linux/
# linux-yocto_6.18.bb overrides neither machine, and this fragment is
# appended unscoped/both-machines below) —
# b1ba5428513b52c2bd6acfd3ad0a910f699bc395, LINUX_VERSION=6.18.24 — the
# exact same "6.18.24+git" this directory's own duduclaw-lsm.cfg already
# cites. Files read in full before writing this: drivers/md/Kconfig,
# crypto/Kconfig.
#
# --- Dependency chain (drivers/md/Kconfig, this exact SRCREV) -----------
#
#   menuconfig MD           bool, depends on BLOCK           (gates the
#                                                              whole `if MD`
#                                                              block below)
#   config BLK_DEV_DM       depends on (DAX || DAX=n) [always true]
#                           select BLOCK_HOLDER_DEPRECATED if SYSFS
#                           select BLK_DEV_DM_BUILTIN
#                           select BLK_MQ_STACKING
#   config DM_VERITY        depends on BLK_DEV_DM
#                           select CRYPTO
#                           select CRYPTO_HASH
#                           select DM_BUFIO
#
# DM_VERITY's own select chain reaches CRYPTO/CRYPTO_HASH/DM_BUFIO
# automatically (same "don't hand-set select-derived symbols" convention
# this directory's duduclaw-lsm.cfg already established) — but
# CRYPTO_HASH (crypto/Kconfig, this SRCREV) is only the generic
# hash-transform REGISTRATION framework:
#
#   config CRYPTO_HASH       tristate, select CRYPTO_HASH2, select
#                             CRYPTO_ALGAPI
#
# it does NOT select any actual digest IMPLEMENTATION. dm-verity's kernel
# side re-hashes every block it reads at runtime and compares against the
# hash tree — without a concrete transform registered, `veritysetup open`
# would fail at the kernel level with no SHA-256 transform available, even
# though the *build-time* `veritysetup format` step (duduclaw-verity.bbclass,
# native cryptsetup, its own userspace OpenSSL backend) computed the tree
# just fine. CRYPTO_SHA256 (crypto/Kconfig) is its own separate,
# NOT-select-derived symbol:
#
#   config CRYPTO_SHA256      tristate, select CRYPTO_HASH,
#                              select CRYPTO_LIB_SHA256
#
# — must be hand-set for the same reason MD/BLK_DEV_DM must: nothing
# upstream of it in the Kconfig graph turns it on automatically.
#
# So the MINIMAL explicit set (everything else — BLK_DEV_DM_BUILTIN,
# BLK_MQ_STACKING, DM_BUFIO, CRYPTO, CRYPTO_HASH, CRYPTO_LIB_SHA256 — is
# select-derived and deliberately left unset here, same discipline as
# duduclaw-lsm.cfg):
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y

# DELIBERATELY NOT ADDED (both real design-assumption checks, not
# oversights):
#
# CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG — this would let the KERNEL itself
# additionally verify a PKCS#7 signature over the roothash against a
# trusted keyring. That is DESIGN §3.2 plan "P2" (root-verity-sig,
# UAPI-automatic discovery) — explicitly the v3 candidate, NOT the plan
# actually shipping this wave ("P1": roothash trusted because it is baked,
# build-time-constant, into a Secure-Boot-signed UKI cmdline — the UKI's
# OWN Authenticode signature is what makes the roothash trustworthy here,
# not a second in-kernel PKCS#7 check). Adding this symbol now would be
# dead weight with no consumer.
#
# CONFIG_DM_INIT (`dm-mod.create=` kernel cmdline table) — the 2026-09-02
# "依賴鏈補記" decision names this as the documented FALLBACK path for
# environments where no shell-capable initrd exists to run `veritysetup
# open` itself. This project's initrd is initramfs-framework (see
# recipes-core/initrdscripts/initramfs-module-duduclaw-verity_1.0.bb) — a
# real shell IS available, so the primary path (a plain `veritysetup open`
# invocation from a custom initramfs-framework module) is what ships. Not
# enabling the fallback's kernel symbol keeps this fragment's blast radius
# to exactly what the primary path needs; revisit only if a future
# initrd-less boot path is ever added.
#
# CONFIG_DM_VERITY_FEC — forward error correction for corrupted-but-
# recoverable blocks. Out of scope: this wave's threat model is tamper
# DETECTION (fail-closed refuse-to-boot), not tamper RECOVERY.
#
# --- Unconditional, like every other fragment in this directory ---------
#
# This fragment is appended unscoped (both duduclaw-qemux86-64 and
# duduclaw-genericx86-64) in linux-yocto_6.18.bbappend, exactly like
# duduclaw-lsm.cfg/duduclaw-nftables.cfg/duduclaw-live-squashfs.cfg/
# duduclaw-binder.cfg — NOT gated behind DUDUCLAW_VERITY_ENABLE. This is a
# deliberate choice, flagged here rather than silently following the
# "everything else in this wave is conditional" discipline
# classes/duduclaw-verity.bbclass's own header documents: a kernel config
# fragment can't be made conditional on a bitbake variable without
# diverging the kernel .config (and therefore the kernel build's own
# sstate signature) between verity-on and verity-off builds — a much
# larger, riskier form of "conditionality" than a no-op userspace task.
# Compiling in dm-verity support that is simply never EXERCISED (no
# `veritysetup open` ever runs unless the matching cmdline tokens are
# present, which only happens when DUDUCLAW_VERITY_ENABLE=1 baked them in)
# is functionally inert — it costs a small amount of kernel image size and
# nothing else, matching how every other hardening fragment in this exact
# directory already ships unconditionally. Flagged here for the record,
# not asserted without evidence: this has NOT been build-tested in this
# read-only reconnaissance session (no bitbake/kas run — see this wave's
# own task brief) — the next real `bitbake duduclaw-image-ab` (or
# duduclaw-image-flatpak) run is the first actual verification that this
# fragment merges cleanly with the other unscoped fragments already in
# linux-yocto_6.18.bbappend's SRC_URI list.
