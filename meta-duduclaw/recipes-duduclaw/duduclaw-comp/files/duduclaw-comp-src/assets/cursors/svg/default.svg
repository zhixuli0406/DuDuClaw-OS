<!-- DuDuClaw OS brand cursor, default arrow (C1 identity, 2026-10-16).
     A standard arrow, not a mascot shape: pointing precision comes first.
     Geometry contract (see ../build-theme.sh): viewBox 24, the arrow tip
     lands exactly on (3,3) = hotspot size*3/24 at every output size.
     Layers, bottom to top:
       1. halo  #F5F4F0 cream: the whole arrow, fill + 2.0u round-join
                stroke, i.e. a 1u halo outside the body. Carries the
                silhouette on dark backgrounds.
       2. body  #102B48 navy: the whole arrow, no stroke. Carries the
                silhouette on light backgrounds.
       3. tail  #CC8B2D amber: the lower stem, painted over the body. The
                navy-body-plus-amber-tail split is the cat mark's own.
     The shell's pointer-settings preview (crates/duduclaw-shell/assets/
     icons/cursor-brand-arrow-{halo,body,tail}.svg) copies these three
     paths verbatim. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <path d="M3 3 L3 20.11 L7.51 15.78 L10.33 21.8 L13.34 20.39 L10.52 14.56 L16.63 14.19 Z" fill="#F5F4F0" stroke="#F5F4F0" stroke-width="2" stroke-linejoin="round"/>
  <path d="M3 3 L3 20.11 L7.51 15.78 L10.33 21.8 L13.34 20.39 L10.52 14.56 L16.63 14.19 Z" fill="#102B48"/>
  <path d="M8.69 18.31 L10.33 21.8 L13.34 20.39 L11.7 17.01 Z" fill="#CC8B2D"/>
</svg>
