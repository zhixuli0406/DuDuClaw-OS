# Link protection (rootless gateway, 2026-10-15).
#
# duduclaw-home-owner.service runs `systemd-tmpfiles` with a recursive `Z`
# over /data/duduclaw, a tree that uid 1000 (the gateway, and therefore any
# AI employee) controls. tmpfiles never follows symlinks, but `Z` does change
# the owner of whatever inode a hardlink points at. /data is its own
# filesystem, so a hardlink cannot reach /etc, but root-owned files on /data
# (/data/system/random-seed, /data/system/machine-id, the rescue audit log)
# could be hardlinked into the home and handed to uid 1000 on the next boot.
# fs.protected_hardlinks=1 makes the kernel refuse to create a hardlink to a
# file the caller does not own and cannot read and write.
#
# systemd's own 50-default.conf normally sets both values already; this file
# makes the guarantee part of this layer instead of relying on that. It
# sorts after 50-default.conf, so it wins if the two ever disagree.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
