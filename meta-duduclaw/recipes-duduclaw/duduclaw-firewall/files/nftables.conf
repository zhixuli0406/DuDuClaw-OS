#!/usr/sbin/nft -f
# DuDuClaw OS default firewall — deny inbound by default, nothing is
# reachable from outside the LAN out of the box.
#
# WS-3/A4 (2026-09-01, DESIGN-os-security-line-2026-09.md §2 支柱一 A4 /
# G10: "Yocto 線零防火牆"). Ported verbatim (rule content, not comments)
# from the Debian appliance line's own already-shipping
# appliance/mkosi.extra/etc/nftables.conf — read directly before porting,
# not recalled from memory. Loaded by nftables.service
# (recipes-filter/nftables/nftables_%.bbappend in this layer forces
# SYSTEMD_AUTO_ENABLE:nftables = "enable" — upstream's own PACKAGECONFIG
# default is "disable" until a config file is actually shipped, see that
# .bbappend's own header). This file is nftables.service's ExecStart
# target (`/usr/sbin/nft -f /etc/nftables.conf` — Debian's own
# nftables_1.1.6-1 source package `debian/nftables.service`, cross-checked
# against sources.debian.org directly: no ConditionPathExists guard, so
# shipping this recipe WITHOUT a config file would make the unit fail
# every boot — this recipe always installs both together for exactly that
# reason).
#
# DASHBOARD_PORT must match the gateway's [gateway] port / DUDUCLAW_BIND
# resolution (default 18789 — crates/duduclaw-core/src/config.rs, same
# crate this Yocto line's duduclaw-cli recipe vendors, confirmed
# byte-identical to the Debian line's own crates/ snapshot per that
# recipe's own refresh-src.sh). If a future dashboard "change port"
# control ships, this file needs the same value written alongside it —
# there's no live templating here, it's a build-time constant, same
# limitation the Debian line's own copy of this file already documents.
#
# --- Yocto-line divergences from the Debian source, checked not assumed ---
#
# (1) SSH: no static port-22 rule. Resolved 2026-10-15: dropbear is now
#     disabled by default on this line (recipes-core/dropbear/
#     dropbear_%.bbappend), matching the Debian line's disabled sshd, and
#     maintenance mode opens it on demand. duduclaw-sysd (platform
#     v1.73.3+) starts dropbear.socket and adds port 22 to the
#     `maintenance_tcp_ports` set below, then removes it and stops dropbear
#     when the window closes. Before that, dropbear listened from first
#     boot; this file blocked it in the desktop edition, but the base
#     edition had no firewall at all (duduclaw-firewall now ships in
#     duduclaw-image-ab.bb, so both editions get it).
# (2) Interface names: none hardcoded in the Debian source beyond `lo`
#     (loopback), so there is nothing machine/interface-name-specific to
#     port — verified by reading the source file in full before starting
#     this port, not assumed from the ruleset's shape alone.
#
# (3) Output chain (2026-10-15, rootless Podman): loopback traffic jumps to
#     `duduclaw_podman_egress`, which duduclaw-podman.service fills at
#     start. See the comment on that chain below.
#
# --- Known-risk item surfaced while porting, NOT resolved in this ticket
# --- (P0 is recipe-only, no bitbake/QEMU run per this ticket's own
# --- discipline — flagged for the next real build+boot verification
# --- pass, not silently shipped as if already checked) ---
#
# `chain forward { policy drop }` below is unchanged from the Debian
# source, which already ships identically alongside `docker.io`
# (appliance/mkosi.conf) with no known regression — but THIS Yocto line's
# own app-compat payload (duduclaw-image-compat.inc) additionally installs
# Waydroid, whose own waydroid-net.sh sets up real bridge+MASQUERADE
# forwarding for Android-app internet access
# (duduclaw-waydroid-net.cfg's own header: "ACCEPT/MASQUERADE targets and
# udp/tcp matches all applied cleanly"), and Linux netfilter runs BOTH the
# legacy-iptables FORWARD chain (Waydroid's own backend,
# CONFIG_NETFILTER_XTABLES_LEGACY) and this nf_tables FORWARD chain at the
# same hook point — an nf_tables DROP verdict is final regardless of what
# the legacy chain decided. A default-deny `forward` chain with zero
# accept rules WOULD therefore be expected, by netfilter's own hook
# semantics, to cut Waydroid's Android apps off from the internet (and any
# Docker container run with `network_access=true` rather than the
# project's own default `--network=none` sandbox posture, per
# crates/duduclaw-container/src/docker.rs). This has NOT been verified
# against a real boot — recipe-only ticket, no bitbake/QEMU run performed
# — flagged here as a concrete follow-up: re-run the existing Waydroid
# app-compat QEMU verification suite once this firewall is actually built
# in, and add a `iifname "waydroid0" accept` / `oifname "waydroid0" accept`
# (or a docker0-equivalent) pair to this forward chain if the regression
# is confirmed, rather than assuming the Debian line's own clean history
# with `docker.io` + this same policy transfers unchanged to a line that
# also runs Waydroid.
#
# 2026-10-15: the Docker half of this paragraph no longer applies. The
# desktop edition now runs rootless Podman; container traffic leaves
# through pasta, a userspace process that opens ordinary host sockets, so
# it never crosses this forward chain (it crosses `output` instead, see
# duduclaw_podman_egress). Waydroid's bridge is still forwarded traffic
# and the follow-up above still stands for it.

flush ruleset

define DASHBOARD_PORT = 18789

table inet filter {
	set maintenance_tcp_ports {
		type inet_service
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		icmp type { echo-request, destination-unreachable, time-exceeded } accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, destination-unreachable, time-exceeded, packet-too-big } accept

		# DHCPv6 replies to multicast Solicit/Request can arrive as ct NEW.
		# Limit bootstrap replies to on-link server/client addresses and ports.
		ip6 saddr fe80::/10 ip6 daddr fe80::/10 udp sport 547 udp dport 546 accept comment "DHCPv6 client replies (link-local)"

		udp dport 5353 accept comment "mDNS — Avahi duduclaw.local discovery"
		tcp dport $DASHBOARD_PORT accept comment "DuDuClaw dashboard (LAN)"

		# Ports maintenance mode opens for its window (SSH = 22), managed
		# only by duduclaw-sysd; see this file's header, divergence (1).
		tcp dport @maintenance_tcp_ports accept comment "DuDuClaw maintenance window"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	# Filled at runtime by duduclaw-podman.service (ExecStartPre,
	# /usr/libexec/duduclaw/podman-egress-guard): drops loopback
	# connections that rootless containers (via pasta, which runs in that
	# unit's cgroup) open towards host services, because `iif "lo" accept`
	# above would otherwise let them reach every local listener. Empty
	# here on purpose: the rule matches the unit's cgroup, which nft
	# resolves to an inode number when the rule is loaded, and that cgroup
	# does not exist yet when this file is loaded at boot. Reloading this
	# file (`flush ruleset`) empties the chain again; duduclaw-podman.service
	# ships a drop-in for this unit that re-adds the rule right after every
	# `systemctl start|restart|reload nftables`, not on a bare `nft -f`. On
	# the base edition (no Podman) it stays empty.
	chain duduclaw_podman_egress {
	}

	chain output {
		type filter hook output priority filter; policy accept;

		oif "lo" jump duduclaw_podman_egress
	}
}
