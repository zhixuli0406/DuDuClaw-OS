# containers.conf drop-in for DuDuClaw OS rootless Podman (uid 1000,
# duduclaw-podman.service). Drop-ins override /etc/containers/containers.conf,
# including the `default_rootless_network_cmd="slirp4netns"` line podman's
# own recipe appends there when PACKAGECONFIG has "rootless".

[engine]
# Podman manages container cgroups itself inside the subtree systemd
# delegates to duduclaw-podman.service (Delegate=yes +
# DelegateSubgroup=supervisor). There is no systemd user manager on this
# OS (no PAM, no logind session for uid 1000), so the "systemd" cgroup
# manager has nobody to talk to.
cgroup_manager = "cgroupfs"
# Under the shared runtime dir (XDG_RUNTIME_DIR=/run/duduclaw-gateway), not
# /tmp: the podman unit runs with ProtectSystem=strict.
tmp_dir = "/run/duduclaw-gateway/libpod/tmp"
# No journald user session to log events into; a file under tmp_dir.
events_logger = "file"

[network]
# pasta (passt) is Podman 5's upstream default; the recipe pins slirp4netns.
default_rootless_network_cmd = "pasta"
firewall_driver = "nftables"
# --no-map-gw: the container's default gateway address is not mapped to the
# host's loopback. This alone does not stop a container from reaching
# services listening on the host (pasta opens its host-side sockets as uid
# 1000 on the host, so any host address works); duduclaw-podman.service
# loads an nftables rule that drops loopback traffic from its own cgroup
# for that, see that unit and its egress-guard script.
pasta_options = ["--no-map-gw"]
