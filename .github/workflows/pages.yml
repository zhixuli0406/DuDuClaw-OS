name: Publish site

# Builds the public site and deploys it to GitHub Pages:
#
#   _site/       <- website/          (zero-build marketing site)
#   _site/docs/  <- docs-site/dist/   (Astro + Starlight docs)
#
# The docs pull Markdown from two repositories: this one, and the public
# whitelist of the platform repo (features / guides / architecture / spec /
# api). The platform repo is checked out read-only into platform/.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs-site/**'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DuDuClaw-OS
        uses: actions/checkout@v4

      - name: Checkout DuDuClaw platform docs
        uses: actions/checkout@v4
        with:
          repository: zhixuli0406/DuDuClaw
          path: platform
          # Only the public docs whitelist is read by scripts/sync-docs.mjs;
          # a sparse checkout keeps the job small.
          sparse-checkout: docs
          sparse-checkout-cone-mode: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      # `base_path` is '' for a custom domain or user page and '/<repo>' for a
      # project page, so the docs base becomes '/docs' or '/<repo>/docs'.
      # docs-site/base.mjs collapses the '//docs' that a base_path of '/'
      # would produce.
      - name: Build docs
        working-directory: docs-site
        env:
          DUDUCLAW_PLATFORM_DOCS: ${{ github.workspace }}/platform/docs
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://example.invalid' }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/docs
        run: npm run build

      - name: Assemble _site
        env:
          SKIP_DOCS: '1'
        run: scripts/build-site.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
