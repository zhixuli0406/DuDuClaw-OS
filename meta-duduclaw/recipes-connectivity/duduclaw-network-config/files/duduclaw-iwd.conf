<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  DuDuClaw OS: let the gateway account talk to iwd, narrowly (2026-10-15,
  rootless gateway).

  The gateway's Wi-Fi settings (crates/duduclaw-gateway/src/network/iwd.rs
  in the platform repo) call iwd on the system bus. iwd's own policy
  (iwd-dbus.conf, from meta-oe's iwd_3.12) admits root and the `netdev`
  group; this image has no `netdev` group, and until 2026-10-15 the gateway
  was root. It now runs as `duduclaw` (uid 1000), the uid every AI employee
  shares, so only what the network page uses is allowed:
    Station        Scan, GetOrderedNetworks (scan and list)
    Network        Connect
    KnownNetwork   Forget
    AgentManager   RegisterAgent / UnregisterAgent (to answer passphrase
                   requests; iwd then calls the gateway's
                   net.connman.iwd.Agent object, which iwd's own root policy
                   already permits)
    ObjectManager  GetManagedObjects, and Properties Get / GetAll (reads)
  Not allowed: AccessPoint, WPS (SimpleConfiguration), DPP, AdHoc,
  P2P, Device/Adapter property writes and any other Properties.Set, and
  owning the iwd name. Stored passphrases stay unreadable (files under
  /var/lib/iwd, root 0700).

  The interface list matches the platform v1.73.x iwd.rs; a new call there
  needs a line here. The upstream policy text on this image is not
  verified yet (V15 in wiki/eval/rootless-verification-2026-10.md):
  cat /usr/share/dbus-1/system.d/iwd-dbus.conf
-->
<busconfig>
  <policy user="duduclaw">
    <allow send_destination="net.connman.iwd" send_interface="net.connman.iwd.Station"/>
    <allow send_destination="net.connman.iwd" send_interface="net.connman.iwd.Network"/>
    <allow send_destination="net.connman.iwd" send_interface="net.connman.iwd.KnownNetwork"/>
    <allow send_destination="net.connman.iwd" send_interface="net.connman.iwd.AgentManager"/>
    <allow send_destination="net.connman.iwd" send_interface="org.freedesktop.DBus.ObjectManager" send_member="GetManagedObjects"/>
    <allow send_destination="net.connman.iwd" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="net.connman.iwd" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="net.connman.iwd" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
