# DuDuClaw OS: dropbear.socket follows duduclaw-sysd (2026-10-16).
#
# Authority: commercial/docs/DESIGN-maintenance-ssh-account-2026-10.md
# (private platform tree) section 4.4. duduclaw-sysd starts this socket when
# a maintenance window opens and stops it when the window closes. BindsTo=
# makes systemd stop it, and with it every session, when sysd is stopped or
# fails for good, so a window can never outlive sysd's own deadline
# handling by sitting on a listening socket. duduclaw-sysd checks that
# BindsTo= contains duduclaw-sysd.service before it opens a window.
#
# MaxConnections / MaxConnectionsPerSource: dropbear's own unauthenticated
# limit is per process, and with Accept=yes every connection is its own
# process, so the socket is where a flood is capped.
[Unit]
BindsTo=duduclaw-sysd.service
After=duduclaw-sysd.service

[Socket]
MaxConnections=16
MaxConnectionsPerSource=4
