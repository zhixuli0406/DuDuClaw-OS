server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static site: no SPA fallback. Starlight ships its own 404 page.
    error_page 404 /docs/404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml application/wasm;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Inline scripts/styles are part of the zero-build site; Pagefind (docs
    # search) needs WebAssembly; fonts come from Google Fonts only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Fingerprinted docs assets and images are safe to cache hard.
    location /docs/_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(png|jpe?g|gif|ico|svg|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js|mjs|json|wasm)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
