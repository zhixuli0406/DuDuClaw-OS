# DuDuClaw OS gateway -- real $HOME on /data (WP-F, 2026-09-05).
#
# The platform repo's docs/todo/TODO-ai-runtimes-2026-09.md §2 現況, last OS bullet: "gateway 以
# root 執行、ProtectHome=read-only、真 $HOME=/root，各家 CLI 的 OAuth token
# 寫在真 $HOME → 需 Environment=HOME=/data/duduclaw".
#
# WHAT WAS ACTUALLY BROKEN. duduclaw-gateway.service runs as root with no
# HOME= of its own, so glibc/systemd hand the process root's passwd entry:
# HOME=/root. The gateway's OWN state was already safe -- 10-data.conf (next
# to this file) sets DUDUCLAW_HOME=/data/duduclaw, and every duduclaw-native
# path derives from that variable. But the ten vendor AI CLIs this image
# now ships (duduclaw-ai-runtimes) know nothing about DUDUCLAW_HOME. Each one
# resolves its credential directory from the real $HOME:
#
#   claude   ~/.claude/.credentials.json      codex    ~/.codex/auth.json
#   gemini   ~/.gemini/oauth_creds.json       qwen     ~/.qwen/
#   kimi     ~/.kimi/                         copilot  ~/.copilot/
#   grok     ~/.grok/auth.json                opencode ~/.local/share/opencode/
#   agent    ~/.local/share/cursor-agent/     vibe     ~/.config/mistral/
#
# With HOME=/root that is ten credential trees on the ROOT PARTITION --
# the one systemd-sysupdate overwrites wholesale on every OS update (the
# exact config-loss failure mode 10-ab-home.conf's own header documents for
# the update staging dir), AND, since VER-RO promoted read-only root to the
# shipping image (2026-09-04, duduclaw-image-appliance.bb's own
# duduclaw-ro-root.inc note), a partition the gateway cannot write at all.
# `claude login` would fail with EROFS, or -- worse, if /root ever rides a
# writable overlay -- appear to succeed and silently lose every token on the
# next update. HOME=/data/duduclaw puts all ten on the durable partition
# the firstboot provisioner creates, chowns, and (this same round) chmod
# 0700's.
#
# WHY A SECOND DROP-IN INSTEAD OF EDITING 10-data.conf: `HOME` and
# `DUDUCLAW_HOME` answer to different owners. DUDUCLAW_HOME is this
# project's own contract, already set identically by two recipes
# (duduclaw-firstboot's 10-data.conf and duduclaw-ab-update's
# 10-ab-home.conf) for two different features; HOME is a POSIX-level
# environment fact that exists for third-party binaries the gateway
# execs. Keeping them in separate files means the AI-runtime feature can be
# read, reviewed and reverted as one file without touching the /data
# provisioning drop-in that predates it -- the same "additive, never mutate
# a verified path" discipline 10-data.conf's own header argues for at the
# level above. `20-` sorts after `10-`, so on any image carrying both, this
# file's setting is applied last; the two set disjoint variables, so the
# ordering is documentation rather than a tie-break.
#
# ProtectHome=read-only (in the base unit) is NOT in the way and is
# deliberately left alone: it read-only-mounts /home, /root and /run/user,
# none of which is /data. The base unit's own `ReadWritePaths=-/data` is
# what keeps this path writable under `ProtectSystem=full`. Verified by
# reading the unit, not assumed -- and worth stating, because the obvious
# wrong fix here is to weaken ProtectHome, which would re-open /root for
# writing to buy nothing.
#
# DUDUCLAW_WINDOWS_VM_APPS_DIR (2026-09-06, same wave): the consequence of the
# 0700 above for the ONE file under the gateway home that a different user
# must read. `duduclaw compat windows-vm app-add` writes the RemoteApp
# registry (apps.toml, 0644) that duduclaw-shell -- running as
# duduclaw-kiosk -- turns into Launcher tiles; a 0700 parent blocks that
# read whatever the file's own mode says, and every pinned Windows app
# would silently vanish from the Launcher. So the registry moves to
# /data/system/windows-vm (root-owned 0755, created by duduclaw-data-binds'
# tmpfiles entry) and BOTH sides are pointed there: the CLI through this
# variable (crates/duduclaw-cli/src/compat_windows_vm.rs
# `WINDOWS_VM_APPS_DIR_ENV`), the shell through its hardcoded default
# (crates/duduclaw-shell/src/apps/windows_vm.rs). compose.yaml and the VM
# storage stay under /data/duduclaw/windows-vm -- only this CLI reads them.
# Migration 1788717600 moves an existing registry on already-provisioned
# machines; duduclaw-cli's duduclaw-home-profile.sh exports the same
# variable for root's interactive shell so `app-add` over serial/SSH agrees
# with the service.
[Service]
Environment=HOME=/data/duduclaw
Environment=DUDUCLAW_WINDOWS_VM_APPS_DIR=/data/system/windows-vm
