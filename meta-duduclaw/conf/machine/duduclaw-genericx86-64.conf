#@TYPE: Machine
#@NAME: DuDuClaw generic x86-64 (real hardware target)
#@DESCRIPTION: Real-hardware target — N305 (Alder Lake-N) / 8845HS (Phoenix)
# mini PCs, per the map's inherited hardware decision (carried over from the
# frozen Debian appliance line, unaffected by the base-OS swap). Thin wrapper
# around meta-yocto-bsp's genericx86-64 for Y1-1 bring-up.
#
# Kernel provider connected + driver fragments applied Y2-2 (2026-08-25) —
# see recipes-kernel/linux/linux-yocto_6.18.bbappend and
# recipes-kernel/linux/linux-yocto/duduclaw-{n305,8845hs,gaming}.cfg.

require conf/machine/genericx86-64.conf

MACHINEOVERRIDES =. "duduclaw-genericx86-64:"

# --- Tune correction (Y2-3, 2026-08-25) -------------------------------------
# The Y2-2 comments elsewhere in this layer (kas/duduclaw-os.yml's TMPDIR
# note, kas/duduclaw-os-genericx86-64.yml's header) CLAIMED "both machines
# use DEFAULTTUNE = x86-64-v3" as an already-true fact -- it was not actually
# true, and the gap was found the hard way: a genericx86-64 build filled the
# builder VM's disk to 0 bytes free and crashed (do_prepare_recipe_sysroot /
# do_compile failing with `OSError: [Errno 28] No space left on device`),
# despite `rm_work` already being active and TMPDIR having 34G free at the
# start. Root cause, confirmed directly (`bitbake-getvar -r
# duduclaw-image-minimal TUNE_PKGARCH` /`DEFAULTTUNE`, not guessed): stock
# `conf/machine/genericx86-64.conf` (meta-yocto-bsp) sets
# `DEFAULTTUNE ?= "core2-64"` -- a deliberately conservative baseline for
# "should boot on a wide range of x86_64 hardware" -- which this layer never
# overrode, so genericx86-64 was silently building its ENTIRE target package
# set under a second, disjoint `core2-64-poky-linux` TUNE_PKGARCH tree with
# ZERO sstate overlap with duduclaw-qemux86-64's `x86-64-v3-poky-linux` tree,
# not the "near-total sstate reuse" both machines' comments assumed.
# Fix: force x86-64-v3 explicitly. Both real-hardware targets this machine
# actually ships on -- N305 (Alder Lake-N) and 8845HS (Zen4/Phoenix) -- fully
# support the x86-64-v3 microarchitecture level (AVX2/BMI2/FMA3), so this
# loses no real compatibility versus the conservative core2-64 default; it
# only affects which of the two the *builder* targets, not what the chips
# support. This restores the sstate-sharing the earlier comments assumed and
# roughly halves this machine's disk/build-time footprint going forward.
DEFAULTTUNE = "x86-64-v3"

# --- Kernel provider aliasing, KMACHINE half (Y2-2) -------------------------
# Same class of bug Y1-1 hit for duduclaw-qemux86-64, discovered again here:
# meta-yocto-bsp/recipes-kernel/linux/linux-yocto_6.18.bbappend ships
# `KMACHINE:genericx86-64 ?= "common-pc-64"` (an override-keyed assignment),
# but our custom MACHINE name is "duduclaw-genericx86-64", not
# "genericx86-64" — and MACHINEOVERRIDES above only prepends
# "duduclaw-genericx86-64:", it never adds bare "genericx86-64" to the
# override list (matching the Y1-1 qemux86-64 precedent, which also never
# added bare "qemux86-64"). So the upstream `:genericx86-64` override for
# KMACHINE silently never applies to us, and KMACHINE would default to
# `${MACHINE}` = "duduclaw-genericx86-64" — an unknown BSP name that fails
# do_kernel_metadata the same way "Could not locate BSP definition for
# duduclaw-qemux86-64/standard" failed in Y1-1. Fix: set KMACHINE directly
# (not via override) to reuse the existing upstream "common-pc-64" BSP
# metadata verbatim — this is the standard generic-x86 kernel BSP Yocto has
# shipped for years, designed for "a moderately wide range of drivers that
# should boot and be usable on typical hardware" (genericx86-64.conf's own
# description), i.e. it already carries broad driver coverage as a baseline
# before our own N305/8845HS-specific fragments (below) are even merged in.
KMACHINE = "common-pc-64"

# The COMPATIBLE_MACHINE regex half of the same fix lives in
# recipes-kernel/linux/linux-yocto_6.18.bbappend (shared file, also carries
# the Y1-1 qemux86-64 fix) — see that file's comment for why it can't be
# done here (COMPATIBLE_MACHINE is an anchored regex literal in the base
# recipe, not something a machine .conf can meaningfully patch).

# --- Disk-conscious image fstype trim (Y2-2) --------------------------------
# genericx86-common.inc unconditionally appends "wic.zst wic.bmap" on top of
# whatever IMAGE_FSTYPES the image recipe already set, on the theory that a
# generic-PC image wants a compressed variant + a block-map sideband file by
# default. Our image recipe (duduclaw-image-minimal.bb) already carries the
# UKI + systemd-boot "wic" artifact via its own IMAGE_FSTYPES:append — the
# two extra fstypes would just be redundant re-encodings of the exact same
# WKS_FILE output (there is only one WKS_FILE, not one per fstype), costing
# extra build time and disk on a build host that is already disk-constrained
# (see meta-duduclaw/README.md "磁碟策略"). Not needed for this milestone's
# PASS criterion (boot + config audit), so trimmed rather than built and
# discarded.
IMAGE_FSTYPES:remove = "wic.zst wic.bmap"

# --- Firmware subset (Y2-2) --------------------------------------------------
# genericx86-common.inc already RRECOMMENDS the base (small) "linux-firmware"
# package via MACHINE_EXTRA_RRECOMMENDS — that package alone does NOT pull in
# any actual vendor firmware blobs (linux-firmware's ~1000+ chip-specific
# blobs are split into individually-named sub-packages, e.g.
# "linux-firmware-i915", precisely so a machine can opt in to only what its
# hardware needs instead of the entire multi-GB upstream tarball; verified
# against openembedded-core/meta/recipes-kernel/linux-firmware/
# linux-firmware_20260410.bb PACKAGES/FILES stanzas — there is no automatic
# MODULE_FIRMWARE-based auto-selection in this oe-core checkout, so this list
# must be explicit). Subset chosen to match the driver fragments below:
#   - linux-firmware-i915      → N305 GuC/HuC (display + media engine)
#   - linux-firmware-iwlwifi   → N305 M.2 Wi-Fi (exact AX-series module TBD,
#     see kernel-self-maintain-2026-08.md §7.1 — this package covers the
#     whole iwlwifi family, not a single SKU, since the shipped module is
#     unconfirmed)
#   - linux-firmware-amdgpu    → 8845HS (Phoenix) VCN/PSP/DC blobs
#   - linux-firmware-mediatek  → 8845HS Wi-Fi (mt7921e/mt7925e; MT7927 has no
#     upstream firmware yet regardless — see kernel-self-maintain-2026-08.md
#     §2.2, not something this package list can fix)
#   - linux-firmware-rtl-nic   → 8845HS 2.5GbE (r8169-loaded rtl_nic/*.fw
#     blobs, covers the rtl8125 family file names)
# Deliberately NOT the bare "linux-firmware-amdgpu-*" per-GPU-generation
# packages or "linux-firmware-iwlwifi-<chip>-<rev>" per-SKU packages — those
# require knowing the exact shipped silicon, which is an open item (see
# kernel-self-maintain-2026-08.md §7.1); the family-level packages above are
# the honest "best subset we can name without the real hardware in hand".
MACHINE_EXTRA_RRECOMMENDS += " \
    linux-firmware-i915 \
    linux-firmware-iwlwifi \
    linux-firmware-amdgpu \
    linux-firmware-mediatek \
    linux-firmware-rtl-nic \
"
