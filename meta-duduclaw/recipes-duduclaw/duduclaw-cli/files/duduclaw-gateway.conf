# Runtime directory shared by duduclaw-gateway.service and
# duduclaw-podman.service (both run as uid 1000 with
# XDG_RUNTIME_DIR=/run/duduclaw-gateway). Created here, not with
# RuntimeDirectory=, because systemd removes a RuntimeDirectory= when its
# unit stops, and two units share this one.
#
# Type Path                    Mode UID      GID      Age Argument
d     /run/duduclaw-gateway    0700 duduclaw duduclaw -
