# VER-RO (2026-09-02, DESIGN-os-trust-chain-2026-09.md "依賴鏈補記"):
# bind-mount SOURCE... actually not a bind mount here (see verify.conf's
# own header for why this recipe uses a plain redirected Path= instead of
# a fifth .mount unit) -- this tmpfiles entry just needs to create the
# /data/system/flatpak-verify directory itself before
# duduclaw-flatpak-kiosk-verify.service/duduclaw-steam-kiosk-verify.service
# (both manual-start-only, never auto-enabled) ever run `flatpak
# --installation=verify ...` against it.
#
# `/data/system` (0755 root:root) is declared here too, matching --
# byte-identical mode/owner to -- recipes-duduclaw/duduclaw-data-binds/
# files/duduclaw-data-binds-dirs.conf's own top-level entry: this recipe
# can land on an image that does NOT also carry duduclaw-data-binds (e.g.
# duduclaw-image-appliance.bb before VER-RO is promoted onto it), so it
# must not assume that package's own tmpfiles file already created the
# parent directory. Two `d` lines for the same path across different
# tmpfiles.d files are fine as long as they agree (systemd-tmpfiles only
# warns on a genuine mode/owner conflict) -- confirmed these two files
# specify the identical 0755 root:root for /data/system.
#
# Ownership matches the flatpak-verify user this recipe's own
# USERADD_PARAM already creates (--gid duduclaw --no-create-home) --
# 0750 (not 0755): this directory holds this recipe's own diagnostic
# Flatpak installation state, no reason for other unprivileged users on
# the box to read it.
#
# Type  Path                          Mode  UID                     GID       Age  Argument
d       /data/system                  0755  root                    root      -
d       /data/system/flatpak-verify   0750  duduclaw-flatpak-verify duduclaw  -
