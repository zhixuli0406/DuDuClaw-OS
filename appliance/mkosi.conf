# DuDuClaw OS — mkosi top-level recipe.
#
# Builds one bootable GPT disk image: UEFI ESP + slot-A root (populated) +
# slot-B root (empty, reserved for the first `systemd-sysupdate` run) +
# /data (grows to fill the rest of the disk on real hardware). Partition
# layout lives in mkosi.repart/ (see that directory for the authoritative
# sizes/types); this file only covers distro selection, package list, and
# how the image boots.
#
# Setting names/sections verified against the upstream mkosi manual
# (2026-08, systemd/mkosi main branch):
#   https://github.com/systemd/mkosi/blob/main/mkosi/resources/man/mkosi.1.md
# Valid top-level sections are exactly: [Distribution] [Output] [Content]
# [Validation] [Build] [Runtime] — there is NO separate [Bootloader]
# section; Bootloader= lives under [Content].
#
# Architecture= below is the DEFAULT baked into this file (and what a bare
# `mkosi build` with no CLI override uses — the shipping target).
# appliance/build.sh overrides it per-build via the documented
# `Architecture=`, `--architecture=` CLI flag (mkosi manual, [Distribution]
# section) when `APPLIANCE_ARCH=arm64` is set; CLI overrides always win
# over file-configured settings per the manual's parsing-order rules ("the
# command line arguments are parsed" first, and "settings configured via
# the command line always override settings configured via configuration
# files"). The architecture-specific kernel package lives in
# mkosi.conf.d/10-arch-{x86-64,arm64}.conf (`[Match] Architecture=` +
# `Packages=`, see those files) rather than here, since Architecture=
# itself is a single-value setting that this default can't branch on.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# D4a-1 (2026-08-23, Wi-Fi): `non-free-firmware` is a Debian archive
# COMPONENT that is disabled by default — mkosi's own manual for
# `Repositories=` says it exists to "enable package repositories that are
# disabled by default ... different components of the Debian/Kali/Ubuntu
# repositories". Without this line NO `firmware-*` package is reachable at
# build time, which is why the pre-D4a image had zero firmware packages and
# no /lib/firmware directory at all (measured on the built raw, see
# commercial/docs/DESIGN-network-settings-2026-08.md §1.1) — not an omission
# from Packages=, the packages simply could not be resolved.
# `main` is listed alongside it because this setting names the component set
# for the build; main is Debian's default and listing it explicitly keeps
# that true rather than depending on whether mkosi treats this as "add to"
# or "replace" the default set.
#
# The firmware PACKAGES themselves are deliberately NOT added yet (decision
# D-③, 2026-08-23): the candidates are large and hardware-specific
# (firmware-iwlwifi 114MB / firmware-atheros 97MB / firmware-realtek 19MB /
# firmware-brcm80211 18MB / firmware-mediatek), and the M1 target boxes
# (N305 / 8845HS) have not arrived, so which one is needed is unknown. Until
# one is added here, a real machine's Wi-Fi NIC has drivers but no firmware
# blob and will not initialize — the gateway reports that honestly as the
# `driver_missing` error class (crates/duduclaw-gateway/src/network/), it is
# not a silent failure. Enabling the component now means adding the right
# package later is a one-line change instead of a repo-plumbing change.
Repositories=main non-free-firmware

[Output]
Format=disk
Output=duduclaw-os
# ImageId ends up in /usr/lib/os-release (VARIANT_ID) inside the built
# image — useful for `duduclaw doctor` / support scripts to recognize an
# appliance install vs a manual `duduclaw install`.
ImageId=duduclaw-os
# ImageVersion is read from mkosi.version by default; kept implicit here
# so `mkosi bump` (or manual edits to mkosi.version) is the single place
# that changes it.
CompressOutput=no
# SplitArtifacts is deliberately OFF: it would extract per-partition images
# by GPT type name, but the A/B dual-root layout (mkosi.repart/20-root-a +
# 21-root-b) has TWO partitions of the SAME type, so their split filenames
# collide and mkosi refuses ("have the same resolved split name ...,
# refusing"). The shippable artifact is the whole-disk duduclaw-os.raw
# (flashed to USB / booted in QEMU) — the split root images were only ever
# wanted for a future systemd-sysupdate PAYLOAD pipeline that doesn't exist
# yet. When that lands it needs per-slot SplitName= overrides in the repart
# drops, not this blanket setting. (The "root-arm64 vs root-x86-64 type fix"
# this comment used to also point at is done: the repart drops use the
# generic Type=root and the sysupdate transfer the generic
# MatchPartitionType=root, both of which systemd resolves to the running
# architecture.)
# H3a note: the root payload still isn't produced here, but the UKI half of a
# payload now is — build.sh's post-build step writes the per-slot pair
# duduclaw-os_<ver>.slot-{a,b}.efi into mkosi.output/. See tools/uki-slots.py.

[Content]
Bootable=yes
Bootloader=systemd-boot
# "auto" would silently fall back to unsigned UKIs if a signing key isn't
# configured; Secure Boot signing / TPM sealing isn't set up yet (see
# README.md "Explicitly out of scope"), so pin explicitly instead of
# relying on auto-detect masking that.
UnifiedKernelImages=yes
# UKI filename in the ESP (H3a, 2026-08-23). `&e` is mkosi's "entry token"
# specifier (= ImageId here, `duduclaw-os`) and `%v` is ImageVersion, read
# from mkosi.version — so this resolves to `duduclaw-os_0.1.0.efi` under
# /EFI/Linux. mkosi's default is `&e-&k`, which is what produced the old
# name `duduclaw-os-6.12.101+deb13-arm64.efi`. Three reasons that name had
# to go:
#   1. systemd-sysupdate's UKI transfer matches on `duduclaw-os_@v...` — the
#      old name matched none of those patterns, so sysupdate could not see
#      the UKI already installed and its InstancesMax accounting was wrong
#      from the start.
#   2. The old name contained a literal `+` (from the Debian kernel version
#      `6.12.101+deb13`), and `+` is exactly the separator sd-boot's boot
#      counting parses. `+deb13` is not followed by digits so per the Boot
#      Loader Specification it should not be read as a counter, but leaving
#      a character the bootloader's filename parser scans for inside a name
#      buys nothing.
#   3. The version, not the kernel version, is the identity that has to be
#      comparable between the two slots — sd-boot sorts entries by version
#      to decide what to boot.
#
# BOOT COUNTING IS ARMED BY build.sh, NOT HERE (H3b, 2026-08-23). This
# format string is the no-counting shape; build.sh overrides it with
# `&e_<version>+&c` and stages /etc/kernel/tries whenever boot counting is
# on — which since H3b is the DEFAULT (APPLIANCE_BOOT_COUNTING=3), yielding
# `duduclaw-os_0.1.0+3.efi` in the ESP. The preconditions that made flipping
# that default safe: systemd-bless-boot present in the image (H3a, package
# `systemd-boot` — see the note under Packages=) and duduclaw-health-check
# .service deciding what a successful boot is (H3c). Note that when this
# setting is given explicitly mkosi does NOT append `+&c` on its own: the
# auto-append only applies to mkosi's built-in default format
# (mkosi/__init__.py, install_uki() — the `if not
# context.config.unified_kernel_image_format` guards), which is why the
# counter has to be spelled out in build.sh's override. Read out of mkosi
# 25.3's own source, first-hand: `&c` is `boot_count`, and boot_count is the
# stripped contents of `<image root>/etc/kernel/tries`, read at install_uki()
# time — which runs after install_extra_trees(), so the staged file is
# already in place when it is read.
# Also note %v expands only when parsed from a config FILE; passing the same
# string on mkosi's command line leaves `%v` literal (verified against
# `mkosi summary` in mkosi 25.3), which is why build.sh substitutes the
# version itself when it overrides this.
UnifiedKernelImageFormat=&e_%v
# Modules the UKI's kernel-modules initrd MUST contain to mount the root fs
# (2026-08-18: without these the initrd found /dev/gpt-auto-root but mount
# failed with status=32 and boot dropped to emergency). mkosi's default
# kernel-modules initrd includes only HOST-loaded modules, and the build
# runs in a container with none loaded, so ext4 (Debian arm64 builds it as
# a module, CONFIG_EXT4_FS=m) and the virtio storage transport were absent.
# mkosi resolves each listed module's dependencies automatically (ext4 pulls
# jbd2/mbcache/crc32c, virtio_blk pulls virtio/virtio_ring, ...).
KernelModulesInitrdInclude=ext4
                           jbd2
                           mbcache
                           crc32c_generic
                           crc16
                           crc32c
                           virtio
                           virtio_ring
                           virtio_blk
                           virtio_pci
                           virtio_mmio
                           virtio_scsi
                           virtio_console
# "ro" is belt-and-braces alongside root-a/b's repart ReadOnly=yes GPT
# attribute (mkosi.repart/20-root-a.conf) — two independent mechanisms
# enforcing the same read-only root, rather than trusting either alone.
# console=ttyS0,115200n8 (serial, first) + console=tty0 (local) is what
# lets smoke-qemu.sh capture boot output over QEMU's -serial stdio; harmless
# on real hardware (headless boxes have nothing attached to either).
# console=ttyAMA0,115200n8 is the same idea for an arm64 build: QEMU's
# `virt` machine (what smoke-qemu.sh uses for APPLIANCE_ARCH=arm64) exposes
# a PL011 UART — "Either one or two PL011 UARTs for the NonSecure World"
# (QEMU docs, docs/system/arm/virt.rst) — which Linux's amba-pl011 driver
# registers as /dev/ttyAMA0, not /dev/ttyS0 (that name is the 8250/16550
# ISA-style UART smoke-qemu.sh's x86-64 `q35` machine provides instead).
# Listing all three console= names in one shared cmdline is deliberate:
# whichever ones don't exist on the running machine are silently ignored
# by the kernel, so this line does not need to be architecture-gated via a
# mkosi.conf.d/ drop-in — it stays correct for both build targets as-is.
# systemd.log_target=kmsg + log_level + show_status=1 were diagnostic (used
# to route the initrd/boot failures onto the serial console while debugging
# the first boots) — restored to a support-friendly default. `quiet` is
# deliberately NOT set: an appliance benefits from visible boot progress on
# the serial console for field support. Console order puts the serial LAST
# so /dev/console (systemd's default log target) is the serial for a
# headless box; kernel printk still reaches tty0 too. `rw`: root-a is
# writable for now (the read-only-root + writable-/var hardening is a
# tracked follow-up, see README/design).
#
# `root=PARTUUID` (H3a, 2026-08-23) is the literal token, with NO `=<value>`
# after it. mkosi replaces exactly this token with
# `root=PARTUUID=<uuid of the first partition whose resolved type starts with
# "root">`, i.e. slot A (mkosi.repart/20-root-a.conf sorts before
# 21-root-b.conf). Read out of mkosi 25.3's own source rather than inferred —
# finalize_cmdline() in mkosi/__init__.py does
#   cmdline = [f"{name}=PARTUUID={root}" if c == f"{name}=PARTUUID" else c ...]
# which is a whole-element equality test, so the token has to stand alone.
KernelCommandLine=systemd.show_status=auto rw root=PARTUUID console=tty0 console=ttyAMA0,115200n8 console=ttyS0,115200n8
# THE root= LINE ABOVE IS LOAD-BEARING FOR A/B ROLLBACK, and it corrects a
# claim this file used to make: "mkosi wires root=PARTUUID into every UKI's
# cmdline automatically for disk-format builds". IT DOES NOT. The
# substitution above is the only mechanism, and it is opt-in. First-hand
# proof (2026-08-23): the `.cmdline` PE section of the then-current
# mkosi.output/duduclaw-os.efi read verbatim
#   systemd.show_status=auto rw console=tty0 console=ttyAMA0,115200n8 console=ttyS0,115200n8
# with no root= at all — meaning root was really being selected by
# systemd-gpt-auto-generator, which is also why slot B's NoAuto=yes attribute
# was load-bearing (see mkosi.repart/21-root-b.conf's own comment).
#
# Why an explicit root= is required now: boot counting retires a UKI, never a
# root partition. If root kept being chosen by gpt-auto (which picks the
# highest partition LABEL by strverscmp), a rollback would boot the OLD
# kernel against the NEW root — and kernel modules live in the root
# (/usr/lib/modules/<kver>), so that pairing has no modules for the kernel
# that booted. Baking the slot's PARTUUID into the UKI binds kernel and root
# together, so one boot-counting decision retires both. Setting root= also
# makes gpt-auto skip root auto-discovery entirely, so the two mechanisms
# can no longer disagree. Full argument:
# commercial/docs/DESIGN-ab-update-rollback-2026-08.md §4.2 / §4.3 option A.
#
# The slot-B twin of this UKI (same bytes, `root=PARTUUID=<slot B>`) is NOT
# built by mkosi — it is derived after the build by build.sh's per-slot UKI
# step, which rewrites those 36 UUID characters in place. See build.sh.
#
# Multi-line continuation syntax (indented, no trailing commas) matches the
# verbatim Packages= example in the mkosi manual's [Content] section.
#
# The kernel package is deliberately NOT listed here — it's architecture-
# specific (`linux-image-amd64` on x86-64, `linux-image-arm64` on arm64;
# both confirmed against packages.debian.org, trixie, 2026-08) and lives in
# the two `[Match] Architecture=` drop-ins under mkosi.conf.d/ instead.
# `Packages=` is a collection setting — "This option may be used multiple
# times in which case the specified package lists are combined" (mkosi
# manual, [Content] section, `Packages=`) — so the drop-in's single package
# name is simply appended to this list at parse time, not a replacement.
#
# systemd-networkd was removed from this list (2026-08): it is NOT an
# installable Debian package in trixie (`apt-get install systemd-networkd`
# fails with "Unable to locate package" — confirmed via
# packages.debian.org's contents search: the `systemd-networkd` binary at
# /usr/lib/systemd/systemd-networkd is shipped inside the main `systemd`
# package, not a separate one; only systemd-resolved/systemd-timesyncd are
# still split out). `systemd` itself is pulled in transitively by every
# other package here (it's Debian's init system), so removing this line
# does not remove the binary or unit file — `systemctl enable
# systemd-networkd.service` in postinst.d/20-users-and-units.sh still
# works unchanged. This was a latent bug on EVERY architecture (not an
# arm64-specific finding), caught while verifying arm64 package
# availability for this round's other Packages= entries.
Packages=systemd-boot-efi
         systemd-boot-tools
         systemd-timesyncd
         systemd-resolved
         nftables
         avahi-daemon
         docker.io
         nodejs
         npm
         python3
         python3-venv
         python3-pip
         e2fsprogs
         dosfstools
         ca-certificates
         curl
         less
         openssh-server
         dbus
         tzdata
         cage
         chromium
         seatd
         login
         mesa-vulkan-drivers
         fonts-noto-cjk
         fonts-noto-color-emoji
         flatpak
         xdg-desktop-portal
         xdg-desktop-portal-gtk
         iwd
         wireless-regdb
         systemd-boot
         systemd-container
         systemd-repart
         iproute2
         fcitx5
         fcitx5-chewing
         fcitx5-modules

# cage / chromium / seatd: the detection-gated kiosk display session (see
# mkosi.extra/etc/systemd/system/duduclaw-kiosk.service — off in effect on
# every headless boot, on only when a display is actually attached; this
# does NOT change any headless behavior). Package names + exact versions
# confirmed against packages.debian.org, trixie, 2026-08:
#   cage      0.2.0-2   "Kiosk compositor for Wayland" — pulls in
#             libwlroots-0.18 and xwayland transitively, not hand-listed
#             here (same convention as docker.io/nodejs above: apt
#             resolves the dependency tree, we only list the thing we
#             actually asked for).
#   chromium  151.0.7922.137-1~deb13u1 — dominates the image-size delta;
#             see README.md for the (estimated) size/RAM cost.
#   login / mesa-vulkan-drivers / fonts-noto-cjk / fonts-noto-color-emoji
#             (Shell-S2 wave, 2026-08-20, all four verified live in the VM
#             rounds — crates/duduclaw-shell/BUILD-LINUX.md stage B-③):
#             `login` fixes a REAL bug found there: this minimal image
#             never installed /bin/login, so agetty's login exec died
#             instantly and serial-getty restart-looped — meaning the
#             APPLIANCE_DEBUG serial root login documented in README.md
#             could never have worked on any build to date, password set
#             or not. `mesa-vulkan-drivers` is what the gpui shell's
#             renderer actually needs (blade speaks Vulkan; lavapipe on
#             boxes with no Vulkan-capable GPU — cage's own GL stack is
#             NOT sufficient), `fonts-noto-cjk` is the shell's zh-TW text
#             (it ships no fonts of its own), and `fonts-noto-color-emoji`
#             fixes the emoji tofu observed in the Chromium dashboard
#             kiosk (no emoji-capable font anywhere in the image).
#   flatpak / xdg-desktop-portal / xdg-desktop-portal-gtk
#             (A4 wave, 2026-08-22 — the app-compatibility layer; scope and
#             every claim below verified first-hand in
#             research/native-os-2026-08/flatpak-portal-scope-2026-08.md,
#             including a live container run of a real Flathub Chromium
#             against duduclaw-comp):
#             `flatpak` is the runtime itself and ships NO portal
#             implementation. `xdg-desktop-portal` is the frontend
#             dispatcher that owns the org.freedesktop.portal.Desktop D-Bus
#             name — without it every portal call answers ServiceUnknown
#             (measured, §3.2②). `xdg-desktop-portal-gtk` is the minimal
#             usable backend (FileChooser/Settings/Notification/Print/
#             AppChooser/Email/Wallpaper/Access/Account/Lockdown/
#             DynamicLauncher — enumerated from that project's own src/
#             directory, not guessed) and needs no compositor-specific
#             Wayland protocol: plain GTK windows, which duduclaw-comp's
#             xdg-shell support already carries.
#             **Deliberately NOT installed: xdg-desktop-portal-wlr** (or any
#             other Screenshot/ScreenCast backend). Those backends forward
#             frames captured via wlr-screencopy, and duduclaw-comp
#             implements no screen-capture protocol at all — the package
#             would be dead weight, not a partial win. Revisit only when
#             CD-4 lands screencopy in the compositor.
#             THE APP REPOSITORY DOES NOT LIVE ON THIS PARTITION: a single
#             Chromium + freedesktop runtime measured 2.4GB on disk, against
#             <1.4GB of headroom in the 5G root. /etc/flatpak/
#             installations.d/10-duduclaw-data.conf (mkosi.extra) points a
#             named installation at /data/flatpak instead — same direction
#             as the "docker data-root belongs on /data" note elsewhere in
#             this file. Only the ~binaries above are on root.
#   seatd     0.9.1-1 — NOT auto-pulled despite being a real runtime need
#             of libwlroots-0.18's libseat1 dependency: libseat1's own
#             Depends is the alternative "seatd | logind", and Debian's
#             package listing for libseat1 shows the "logind" side of
#             that alternative as unsatisfiable in this suite (nothing
#             here declares `Provides: logind` — that virtual package
#             name belongs to elogind, which this image doesn't install;
#             real systemd-logind, which this image DOES have as part of
#             the systemd package, doesn't provide it). apt would
#             probably still resolve to seatd on its own, but listing it
#             explicitly matches this file's existing philosophy (ToolsTree=
#             comment above, ExtraTrees= comment below): one explicit
#             source of truth, not a dependency-resolution assumption.
#   iwd / wireless-regdb
#             (D4a-1 wave, 2026-08-23 — Wi-Fi. Selection reasoning and the
#             measurements behind it are in
#             commercial/docs/DESIGN-network-settings-2026-08.md §2, decision
#             A-①: iwd + systemd-networkd over NetworkManager +
#             wpa_supplicant, measured on THIS image — 2 new packages /
#             2.8MB vs 12 / 17.8MB, and 0.46MB vs 5.80MB resident under an
#             identical WPA2-PSK association.)
#             `iwd` owns the 802.11 association layer only; the IP layer is
#             systemd-networkd's (Debian ships iwd with
#             EnableNetworkConfiguration=false), which costs zero extra
#             packages because systemd-networkd lives inside the `systemd`
#             package — see the systemd-networkd note further up. The
#             matching /etc/systemd/network/25-wireless-dhcp.network is in
#             mkosi.extra.
#             `wireless-regdb` is only a Recommends of iwd, so
#             --no-install-recommends WOULD skip it; it is 39KB, lives in
#             `main` (unaffected by the non-free-firmware component above),
#             and without it the regulatory database is absent — hence
#             listed explicitly, same philosophy as seatd above.
#             THE netdev GROUP IS NOT CREATED BY THIS PACKAGE: iwd's Debian
#             packaging has no postinst and no adduser dependency (Debian bug
#             #1098212, still open), while its D-Bus policy file references
#             the group — so postinst.d/20-users-and-units.sh creates it, and
#             a dbus-daemon "Unknown group 'netdev'" warning at boot is the
#             symptom if that ever regresses.
#   systemd-boot / systemd-container / systemd-repart / iproute2
#             (H3a wave, 2026-08-23 — the A/B update closed loop. The first
#             two close the two P0 gaps found by scanning the BUILT image's
#             bytes, not its config: neither systemd-sysupdate nor
#             systemd-bless-boot existed in any image shipped to date. See
#             commercial/docs/DESIGN-ab-update-rollback-2026-08.md §1.5-§1.7.)
#             The package split is the whole trap here: `systemd-boot-efi`
#             holds only the EFI binaries, `systemd-boot-tools` only bootctl
#             and its man pages — NEITHER contains systemd-bless-boot, which
#             lives in the third package, plain `systemd-boot`
#             (/usr/lib/systemd/systemd-bless-boot + its .service + the
#             bless-boot generator; file list read out of the trixie .deb).
#             All three are merely `Suggests:` of `systemd`, so nothing pulls
#             them in implicitly.
#             `systemd-boot` is what makes a boot markable as successful.
#             WITHOUT IT, TURNING ON BOOT COUNTING IS WORSE THAN LEAVING IT
#             OFF: every boot decrements the counter and nothing ever clears
#             it, so a perfectly healthy machine rolls itself back on the 3rd
#             reboot. That is why this package lands in H3a and boot counting
#             itself only in H3b — the order is not interchangeable.
#             `systemd-container` is where /usr/lib/systemd/systemd-sysupdate
#             lives (Debian's packaging choice, nothing to do with
#             containers). duduclaw-sysd's SysupdateStatus/SysupdateApply
#             verbs shell out to that binary, so until now both would have
#             failed to spawn on a real box. Size was the open question at
#             design time (5G root, 1.44GiB actually free measured on the
#             2026-08-23 image via its ext4 superblock) — measured on real
#             trixie: systemd-container 2549KiB + its only new dependency
#             libfdisk1 652KiB on arm64 (2028KiB + 588KiB on amd64). All four
#             packages here plus their new dependencies total 8.5MiB (arm64) /
#             7.3MiB (amd64), i.e. ~0.6% of the free space. Comfortably in
#             budget, so the hybrid plan (sysupdate owns the root-partition
#             write + version bookkeeping, we own UKI install and rollback)
#             stands and the all-bespoke `dd`+`sfdisk` alternative is not
#             needed.
#             `systemd-repart` is listed because the image HAS
#             systemd-repart.service and the binary today while nothing in
#             this list asked for it and `apt-get install --simulate` of this
#             whole list does not produce it — mkosi appears to add it
#             implicitly for bootable disk images. The mechanism was never
#             confirmed, and duduclaw-firstboot-repart.service depends on it
#             absolutely (it is what grows /data to fill a real disk), so it
#             is named here rather than left resting on an unexplained
#             coincidence.
#             `iproute2` supplies `ip`, and is the diagnosis floor for a
#             headless box: with no `ip`, a support session on a machine that
#             will not come up has no way to read link state, addresses or
#             routes. 4208KiB arm64 / 3774KiB amd64 (+libbpf1).

# Reuses mkosi.repart/ (already the RepartDirectories= for building the
# disk's partition table, auto-discovered per mkosi's "If mkosi.repart/
# exists in the local directory, it will be used for this purpose as well")
# as a SECOND thing: plain files copied into the running image at
# /usr/lib/repart.d/, so systemd-repart re-applies the exact same
# definitions against the real disk at first real boot (see
# mkosi.extra/usr/local/sbin/duduclaw-firstboot-repart.sh — that's the
# "systemd-repart 擴 /data 吃滿磁碟" step). One directory, one source of
# truth, instead of hand-duplicating four small files into mkosi.extra/
# and risking them drifting apart from the build-time definitions.
# ExtraTrees= "SOURCE:TARGET" colon-pair syntax verified against the
# upstream mkosi manual, 2026-08.
ExtraTrees=mkosi.repart:/usr/lib/repart.d

# Post-install: create the system users and enable the units. The AI CLIs
# (claude-code/codex/gemini-cli) are NOT installed here — mkosi's postinst
# sandbox has no outbound network, so they are vendored in a Docker build
# (appliance/Dockerfile.cli-vendor) and copied into /usr/local via build.sh's
# ExtraTree instead. PostInstallationScripts= "takes a comma-separated list
# of paths to executables" (mkosi manual, [Content] section).
PostInstallationScripts=postinst.d/20-users-and-units.sh

[Build]
# Build tools (mkfs.*, bootctl, systemd-repart, ...) come from a dedicated
# mkosi-built tools tree instead of whatever happens to be installed on the
# Docker build host — this is what makes the image reproducible when
# building via container/Docker on macOS.
#
# NO ToolsTree — deliberately (two real failures, 2026-08-18): mkosi 25.3's
# syntax is `default` not the main-branch-documented `yes` (25.3 treats
# `yes` as a literal path), and 25.3's tools-tree bootstrap hard-requires
# `?exact-name(grub-pc-bin)` — an x86-BIOS-only package that does not exist
# on arm64, so any arm64 build dies inside the tools tree before touching
# our image. The canonical build path is the Dockerfile.mkosi-runner
# container, which IS the controlled toolbox (explicit build-tool install
# list there, hard-fail if missing); native-Linux community builds use the
# host's tools — documented in README, acceptable for A-prime self-builders.
