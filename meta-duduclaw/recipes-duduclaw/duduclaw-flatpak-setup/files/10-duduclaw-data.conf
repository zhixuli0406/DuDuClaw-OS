# DuDuClaw OS: the named Flatpak installation every shipped app lives in.
# Root is read-only (dm-verity line) and /var/lib/flatpak would not survive
# an A/B update; /data is the one writable, persistent tree. The desktop
# shell installs and lists apps with `--installation=data` (duduclaw-shell
# src/apps.rs) and the polkit rule in duduclaw-polkit-flatpak is scoped to
# it -- without this file (which the Yocto line lost when it replaced the
# mkosi appliance's /etc tree) every `flatpak ... --installation=data`
# call failed with "Could not find installation data", so no app could
# ever be installed from the Launcher and the 3.4 GB offline repo shipped
# under /opt was never consulted.
[Installation "data"]
Path=/data/flatpak
DisplayName=DuDuClaw app storage (/data)
StorageType=harddisk
