# DuDuClaw OS: dropbear runs only for the maintenance account (2026-10-16).
#
# Authority: commercial/docs/DESIGN-maintenance-ssh-account-2026-10.md
# (private platform tree) section 4.4. duduclaw-sysd compares the ExecStart
# below, token by token, with its own constant before it opens a window,
# and the image build compares it with DUDUCLAW_MAINT_DROPBEAR_ARGV
# (recipes-core/images/duduclaw-maint-checks.inc). Change all three
# together or windows stop opening.
#
# ExecStart flags:
#   -i                 one process per connection (dropbear.socket Accept=yes)
#   -r <key>           the ed25519 host key on /data (the root is read-only
#                      on the desktop edition; dropbearkey.service makes it)
#   -w                 no root login
#   -s                 no password login at all (public key only)
#   -j -k              no local and no remote port forwarding (-j also
#                      refuses unix-socket forwarding)
#   -m                 no message of the day
#   -T 3               at most 3 authentication attempts per connection
#   -I 1800            drop a session idle for 30 minutes
#   -G duduclaw-maint  only members of this group may log in; without it,
#                      -D below would let any account (duduclaw-rescue has a
#                      real shell) use the maintenance key. A missing group
#                      makes dropbear exit, which refuses everyone
#   -D <dir>           authorized_keys come from the tmpfs directory
#                      duduclaw-sysd writes for the open window, for every
#                      account; no ~/.ssh is ever read
#   -c <menu>          every session runs the fixed menu, whatever the client
#                      asked for (sftp and scp included)
# EnvironmentFile= (empty) drops /etc/default/dropbear, whose
# DROPBEAR_EXTRA_ARGS would otherwise not matter here but could confuse a
# reader of the unit.
#
# BindsTo=/After= duduclaw-sysd.service: if sysd stops or ends up failed
# (start limit reached), systemd stops every session with it. A single
# crash goes through auto-restart without passing inactive/failed, so it
# does not trigger this; sysd's startup cleanup covers that gap.
#
# IPAddressDeny=any: a session cannot open IP connections of its own. The
# accepted SSH connection itself belongs to dropbear.socket and is not
# filtered by this list. Needs CONFIG_CGROUP_BPF, which the kernel recipe
# asserts; without it systemd only warns.
#
# ProtectProc=invisible: other users' processes stay hidden, so the menu's
# `systemctl status` cannot show AI employees' command lines.
#
# InaccessiblePaths: the gateway's home, the kiosk's home, saved Wi-Fi
# networks and the container store, on top of their own permissions.
[Unit]
RequiresMountsFor=/data
BindsTo=duduclaw-sysd.service
After=duduclaw-sysd.service

[Service]
EnvironmentFile=
ExecStart=
ExecStart=-/usr/sbin/dropbear -i -r /data/system/dropbear/dropbear_ed25519_host_key -w -s -j -k -m -T 3 -I 1800 -G duduclaw-maint -D /run/duduclaw-maint-ssh -c /usr/libexec/duduclaw/maint-shell
IPAddressDeny=any
NoNewPrivileges=yes
ProtectProc=invisible
ProtectHome=yes
PrivateTmp=yes
ProtectSystem=strict
InaccessiblePaths=-/data/duduclaw -/data/duduclaw-kiosk -/data/system/iwd -/data/system/containers
