# DuDuClaw OS — Intel N305 (Alder Lake-N) driver fragment (Y2-2, 2026-08-25).
#
# Standard kernel-yocto .cfg fragment: raw CONFIG_* lines, no .scc feature
# graph needed (kernel-yocto.bbclass's find_sccs() treats any SRC_URI entry
# ending .cfg the same as .scc — see linux-yocto_6.18.bbappend). Merged on
# top of the "common-pc-64" BSP baseline (duduclaw-genericx86-64.conf's
# KMACHINE), which likely already enables a good chunk of this — the
# fragment makes the requirement explicit/durable regardless of what the
# BSP baseline happens to default to, per research/native-os-2026-08/
# kernel-self-maintain-2026-08.md §5's "existing verified config as
# baseline + explicit overlay" strategy. Actual y/m outcome per symbol is
# audited against the built .config, not assumed from this file alone —
# see the Y2-2 TODO entry for the audit table.
#
# Citations below are all research/native-os-2026-08/kernel-self-maintain-
# 2026-08.md §2.1 unless noted.

# Display/graphics — i915 is mainline-ready since 5.18 for ADL-N specifically
# (Phoronix), 6.18 is far past that threshold. Module (not builtin) so it
# can be swapped/blacklisted without a kernel rebuild, matching how the
# rest of this fragment treats driver enablement.
CONFIG_DRM_I915=m

# Wired network — N305 boards ship either Intel I225/I226 (igc) or the
# older I219 (e1000e); board-specific, unconfirmed without `lspci -nn` on
# the real board (§7.1 unconfirmed item). Both enabled so either SKU works
# without a rebuild.
CONFIG_E1000E=m
CONFIG_IGC=m

# Audio — snd-hda-intel is long-stable, no version risk.
CONFIG_SND_HDA_INTEL=m

# Wi-Fi — N305 has no on-die Wi-Fi, relies on an M.2 card. iwlwifi covers
# the whole Intel Wi-Fi family (exact shipped chip unconfirmed, §7.1);
# IWLMVM is the modern driver stack used by AX2xx-class cards, the most
# likely SKU for a 2026-era board.
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
