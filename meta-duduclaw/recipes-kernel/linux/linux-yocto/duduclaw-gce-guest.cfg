# KVM guest support for the generic image on Google Compute Engine.
# Google requires CONFIG_KVM_GUEST=y for custom kernels:
# https://cloud.google.com/compute/docs/images/building-custom-os
# Linux 6.18 arch/x86/Kconfig puts PARAVIRT under HYPERVISOR_GUEST;
# KVM_GUEST depends on PARAVIRT and selects PARAVIRT_CLOCK (kvmclock).
# https://github.com/torvalds/linux/blob/v6.18/arch/x86/Kconfig
# Keep these separate from duduclaw-kvm.cfg, which configures a KVM host.
# Requests alone are insufficient: the recipe checks the final .config.
CONFIG_HYPERVISOR_GUEST=y
CONFIG_PARAVIRT=y
CONFIG_KVM_GUEST=y
CONFIG_PARAVIRT_CLOCK=y
