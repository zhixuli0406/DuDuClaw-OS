# TPM2 kernel enablement — trust chain P1 wave TPM (2026-09-02,
# commercial/docs/DESIGN-os-trust-chain-2026-09.md §4 +拍板 T5/T6/T7).
#
# Sourced one-hand from the ACTUAL pinned kernel source (same mirror/SRCREV
# convention as duduclaw-verity.cfg one wave prior, read directly, not
# recalled from memory): the linux-yocto bare git mirror cached at
# /yocto-cache/downloads/git2/git.yoctoproject.org.linux-yocto.git inside
# the duduclaw-yocto builder container, at this project's own pinned
# SRCREV_machine:qemux86-64 (also the effective SRCREV_machine default for
# duduclaw-genericx86-64 — same fragment applies unscoped, both machines,
# matching duduclaw-verity.cfg's own precedent) —
# b1ba5428513b52c2bd6acfd3ad0a910f699bc395, LINUX_VERSION=6.18.24. File
# read in full before writing this: drivers/char/tpm/Kconfig.
#
# --- Dependency chain (drivers/char/tpm/Kconfig, this exact SRCREV) -----
#
#   menuconfig TCG_TPM     tristate, depends on HAS_IOMEM, imply SECURITYFS,
#                          select CRYPTO, select CRYPTO_HASH_INFO
#   config TCG_TIS_CORE    tristate (select-derived, no help text consumed
#                          standalone)
#   config TCG_TIS         tristate, depends on X86 || OF, select TCG_TIS_CORE
#
# HAS_IOMEM (lib/Kconfig, this exact SRCREV) is `depends on !NO_IOMEM,
# default y` — x86_64 never sets NO_IOMEM, so this resolves to y without
# being hand-set here (same "don't hand-set symbols the arch Kconfig
# already defaults on" discipline duduclaw-lsm.cfg/duduclaw-verity.cfg
# both already follow). SECURITYFS is only `imply`d (soft — TCG_TPM does
# NOT hard-require it to build) and is ALREADY =y from this same
# directory's duduclaw-lsm.cfg (WS-3/A5, 2026-09-01) — not duplicated
# here. TCG_TIS_CORE is select-derived from TCG_TIS, same "don't hand-set
# select-derived symbols" convention as duduclaw-verity.cfg's own
# CRYPTO/CRYPTO_HASH/DM_BUFIO omission.
#
# TCG_TIS (not TCG_TIS_SPI/TCG_CR50/TCG_VTPM_PROXY/other TPM backends):
# this project's own task brief states the QEMU verification target uses
# `-tpmdev emulator,...-device tpm-tis` (swtpm's TIS/FIFO transport, per
# QEMU's own tpm.html spec doc — the SAME transport class real dTPM/fTPM
# chips on PC-class hardware use, TCG PC Client TIS 1.2 / PTP FIFO 2.0,
# not SPI or CR50-specific framing) — TCG_TIS is the one driver this
# design's §4 threat model (LUKS `/data` unlock, TCG PC Client platform)
# actually needs, on both the QEMU harness and the target miniPC hardware.
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y

# DELIBERATELY NOT ADDED (real design-scope checks, not oversights):
#
# CONFIG_TCG_TIS_SPI / CONFIG_TCG_CR50 / CONFIG_TCG_VTPM_PROXY / CONFIG_
# TCG_TIS_I2C_* — different TPM transports (SPI-attached embedded TPMs,
# Chromebook cr50, virtio-vtpm passthrough for nested VMs). This is a
# PC-class TIS/FIFO target (QEMU tpm-tis device model; §5.2 of the design
# doc's own verification table names real miniPC dTPM/fTPM as the ONLY
# thing QEMU cannot substitute for — the TRANSPORT itself, TIS, is not in
# that gap). Revisit only if G7 real-hardware verification finds the
# target miniPC's TPM attached over a different bus.
#
# CONFIG_TCG_TPM2_HMAC — encrypted-transport HMAC sessions for the TPM
# bus itself (defends against bus snooping/interposer attacks on the
# physical LPC/SPI/I2C wire between CPU and TPM chip). Real hardening
# value, genuinely out of THIS wave's scope (§4.1's own PCR 7+11 threat
# model is "has the boot chain been tampered with", not "is the TPM bus
# being sniffed right now") — not a rejected idea, a deferred one; revisit
# alongside a future physical-tampering threat-model pass, not bundled
# into this wave's blast radius.
#
# CONFIG_HW_RANDOM_TPM — exposes the TPM's RNG as a hwrng source. Harmless
# either way but not load-bearing for this wave's own scope (LUKS unlock
# via TPM2 policy, not TPM as an entropy source); duduclaw-verity.cfg's
# own CRYPTO_SHA256 line already established this project doesn't add
# incidental capability symbols beyond what a wave's own threat model
# calls for.
#
# --- Unconditional, like every other fragment in this directory --------
#
# This fragment is appended unscoped (both duduclaw-qemux86-64 and
# duduclaw-genericx86-64) in linux-yocto_6.18.bbappend, exactly like
# duduclaw-verity.cfg one wave prior — NOT gated behind
# DUDUCLAW_TPM_ENABLE. Same reasoning duduclaw-verity.cfg's own header
# already gives for its own unconditional fragment: a kernel .config
# cannot be made conditional on a bitbake variable without diverging the
# kernel build's own sstate signature between tpm-on/tpm-off builds, and
# compiling in TPM2 kernel support that is simply never EXERCISED (no
# `/dev/tpm0` consumer runs unless DUDUCLAW_TPM_ENABLE=1 bakes the
# matching userspace chain — classes/duduclaw-tpm.bbclass) is functionally
# inert on a machine with no physical TPM: TCG_TIS's own probe simply
# finds no device and the driver stays dormant, matching how CONFIG_
# DM_VERITY being compiled in costs nothing when no `roothash=` cmdline
# token is ever baked.
