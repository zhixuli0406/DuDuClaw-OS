<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  DuDuClaw OS: let the gateway account talk to iwd (2026-10-15, rootless
  gateway).

  The gateway's Wi-Fi settings (crates/duduclaw-gateway/src/network/iwd.rs in
  the platform repo) call iwd on the system bus. iwd's own policy
  (iwd-dbus.conf, from meta-oe's iwd_3.12) admits root and the `netdev`
  group; this image has no `netdev` group, and until 2026-10-15 the gateway
  was root. It now runs as `duduclaw` (uid 1000), so it is named here.

  This lets the gateway (and therefore any AI employee, same uid) scan,
  connect to and forget Wi-Fi networks, which is what the dashboard's
  network page does. It does not let it own the iwd name or read the stored
  passphrases (those are files under /var/lib/iwd, root 0700).

  The exact upstream policy text on this image is not verified yet (V15 in
  wiki/eval/rootless-verification-2026-10.md):
  cat /usr/share/dbus-1/system.d/iwd-dbus.conf
-->
<busconfig>
  <policy user="duduclaw">
    <allow send_destination="net.connman.iwd"/>
  </policy>
</busconfig>
