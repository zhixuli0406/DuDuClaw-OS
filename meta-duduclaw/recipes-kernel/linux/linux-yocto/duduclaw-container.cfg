# DuDuClaw OS — docker container runtime networking + overlay2 storage
# support (CP-2 wave-1 B1, 2026-08-30).
#
# Why: DESIGN-app-compat-layer-2026-08.md §2.3 路 B runs a Windows VM
# inside `dockur/windows`, driven by `docker compose` (TODO-compat-
# cp2-2026-08.md: "docker/docker-compose 現成於 meta-virtualization"). The
# rootfs already carries docker via meta-virtualization's recipes, but
# recipes alone don't turn on the kernel symbols dockerd needs at
# runtime — that gap is what this fragment closes.
#
# Sourcing method (two independent, cross-checked sources — not guessed
# from memory, per this project's research discipline):
#
# (1) PRIMARY — the exact kernel-side fragment meta-virtualization itself
#     wires for Docker. meta-virtualization/recipes-kernel/linux/
#     linux-yocto_virtualization.inc's KERNEL_CACHE_FEATURES references
#     `cfg/docker.scc` from the SAME yocto-kernel-cache repo this kernel
#     already fetches via SRC_URI's type=kmeta entry (see
#     openembedded-core's linux-yocto_6.18.bb) — but only when
#     DISTRO_FEATURES contains "virtualization"/"vcontainer", which this
#     OS deliberately does not set (see meta-duduclaw/kas/
#     duduclaw-os.yml's DISTRO_FEATURES note). Rather than flip that
#     distro-wide switch for one fragment, this file inlines the same
#     symbols directly — read straight off the pinned yocto-6.18 branch
#     inside the already-fetched git.yoctoproject.org.yocto-kernel-cache
#     mirror (`git show yocto-6.18:cfg/docker.scc`, which itself
#     `include`s `cfg/lxc.scc` + `features/bpf/bpf.scc` and then applies
#     `cfg/docker.cfg`):
#       cfg/docker.cfg: NETFILTER_XT_MATCH_ADDRTYPE=m, IP_NF_FILTER=m,
#         NF_NAT=m, NF_CONNTRACK=y, DM_THIN_PROVISIONING=m,
#         NETFILTER_XT_MATCH_BPF=m, IP_NF_NAT=m, IP_NF_TARGET_MASQUERADE=m,
#         NETFILTER_XT_MATCH_IPVS=m, OVERLAY_FS=y, CGROUP_BPF=y,
#         VLAN_8021Q=y, BRIDGE_VLAN_FILTERING=y, IPVLAN=m,
#         NETFILTER_XTABLES_LEGACY=y, IP_NF_IPTABLES_LEGACY=m (the last
#         two are this exact yocto-6.18 branch's own fix for the kernel
#         6.18 iptables legacy/nftables split, per that file's own
#         comment: "Docker uses legacy iptables, so we need the full
#         dependency chain: NETFILTER_XTABLES_LEGACY -> IP_NF_IPTABLES_
#         LEGACY -> IP_NF_FILTER/NAT" — this is exactly why IP_NF_FILTER/
#         IP_NF_NAT/IP_NF_TARGET_MASQUERADE show as entirely absent, not
#         merely disabled, in the current .config: their Kconfig deps
#         aren't satisfied without the legacy-backend symbol first).
#       cfg/lxc.cfg (docker.scc's own include, cgroups/namespaces
#         foundation): all namespace/cgroup symbols already satisfied by
#         this kernel's baseline systemd requirements (see "already
#         satisfied" list below) except MACVLAN/VXLAN — omitted, see
#         "deliberately omitted" below.
#       features/bpf/bpf.cfg: BPF/BPF_SYSCALL/BPF_JIT/BPF_EVENTS/
#         BPF_UNPRIV_DEFAULT_OFF/CGROUP_BPF all already satisfied.
#
# (2) CROSS-CHECK — docker upstream's own contrib/check-config.sh
#     (https://raw.githubusercontent.com/moby/moby/master/contrib/
#     check-config.sh), fetched and read directly rather than recalled.
#     Its "Generally Necessary" bucket agrees with (1) on every symbol
#     above, PLUS one correction to this ticket's own draft candidate
#     list: the ticket text suggested NETFILTER_XT_MATCH_IPVS could be
#     skipped as swarm/ipvs-only, but check-config.sh buckets
#     NETFILTER_XT_MATCH_IPVS itself under "Generally Necessary" — it is
#     the netfilter xt match *module* dockerd's own iptables rule chains
#     reference, distinct from CONFIG_IP_VS (the actual IPVS load-
#     balancer subsystem, which check-config.sh correctly buckets under
#     "Optional Features" and which this fragment does omit, see below).
#     Both primary and cross-check sources therefore agree
#     NETFILTER_XT_MATCH_IPVS should ship — corrected in from the
#     ticket's draft list, not silently dropped.
#
# Current-.config gap check: read directly (not re-run through bitbake —
# "成本高" per this ticket's own instruction) from the real post-CP-1
# build output still on disk — CP-1's A1 binder work populated this same
# tree, confirmed fresh by grep (CONFIG_ANDROID_BINDER_IPC=y and
# CONFIG_SQUASHFS=y both already present):
#   /yocto-vmfs/tmp-duduclaw-qemux86-64/work/duduclaw_qemux86_64-poky-
#   linux/linux-yocto/6.18.24+git/linux-duduclaw_qemux86_64-standard-
#   build/.config
#
# --- Symbols this fragment ADDS (currently off or entirely absent from
# --- Kconfig output because a dependency isn't met yet) ---
#
# 6.18 legacy-iptables unlock chain — root cause of the IP_NF_* absences
# above; without these two, nothing else in this file can even appear as
# a selectable Kconfig symbol:
CONFIG_NETFILTER_XTABLES_LEGACY=y
CONFIG_IP_NF_IPTABLES_LEGACY=m

# Filter/NAT/masquerade — the actual iptables tables + MASQUERADE target
# dockerd's DOCKER/DOCKER-USER/POSTROUTING chains rely on for bridge-
# network outbound NAT. NF_CONNTRACK bumped m->y (was already =m, but
# docker.cfg wants it built-in, not merely available-as-module) — every
# other symbol in this group is a straight add (was absent):
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_TARGET_MASQUERADE=m
CONFIG_NF_CONNTRACK=y

# Netfilter xt matches dockerd's rule chains reference:
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_NETFILTER_XT_MATCH_IPVS=m
CONFIG_NETFILTER_XT_MATCH_BPF=m

# overlay2 storage driver — this OS's target driver per TODO-compat-
# cp2-2026-08.md's own framing ("目標：docker 基本 bridge 網路＋overlay2
# storage 可用"):
CONFIG_OVERLAY_FS=y

# Bridge networking — VLAN_8021Q bumped m->y per docker.cfg's own
# comment ("standard kernel has this as module, but some docker specific
# values required it to be built in"); BRIDGE_VLAN_FILTERING was
# entirely absent (dependency-gated on VLAN_8021Q):
CONFIG_VLAN_8021Q=y
CONFIG_BRIDGE_VLAN_FILTERING=y

# Included for parity with the upstream docker.cfg fragment even though
# neither is strictly required for the bridge+overlay2 baseline — both
# are cheap modules (zero runtime footprint unless actually selected)
# and dropping them would mean hand-trimming a fragment the whole Yocto
# container ecosystem already treats as one unit, on no stronger
# evidence than "we don't need it yet": IPVLAN (alternate network
# driver) and DM_THIN_PROVISIONING (devicemapper storage driver, an
# alternative to the overlay2 driver this OS actually targets):
CONFIG_IPVLAN=m
CONFIG_DM_THIN_PROVISIONING=m

# --- Already satisfied — no action, listed so the "why isn't X here"
# --- question has an answer on file rather than requiring a re-check.
# --- Confirmed against the same .config snapshot above, not assumed:
#   CONFIG_NF_NAT=m                    (docker.cfg wants =m — matches)
#   CONFIG_CGROUP_BPF=y
#   CONFIG_BRIDGE=y
#   CONFIG_BRIDGE_NETFILTER=y
#   CONFIG_KEYS=y
#   CONFIG_POSIX_MQUEUE=y
#   CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
#   CONFIG_NETFILTER_XT_MARK=m
#   CONFIG_VETH=y
#   CONFIG_NAMESPACES=y (+ UTS/IPC/USER/PID/NET_NS all =y)
#   CONFIG_CGROUPS=y (+ CGROUP_DEVICE/CPUSETS/MEMCG/CGROUP_SCHED/
#     FAIR_GROUP_SCHED/CGROUP_CPUACCT/CGROUP_FREEZER/BLK_CGROUP/
#     CGROUP_NET_PRIO all =y)
#   CONFIG_SECCOMP=y / CONFIG_SECCOMP_FILTER=y / CONFIG_USER_NS=y
#   CONFIG_BPF=y (+ BPF_SYSCALL/BPF_JIT/BPF_EVENTS/BPF_UNPRIV_DEFAULT_OFF)
# (Most of this baseline comes from oe-core's unconditional
# `features/netfilter/netfilter.scc` in linux-yocto_6.18.bb plus this
# OS's systemd requirement, not from anything docker-specific — docker
# simply piggybacks on an already-solid namespace/cgroup foundation.)
#
# --- Deliberately OMITTED — swarm/multi-host/advanced features outside
# --- this wave's stated target ("不求 swarm/ipvs 全家桶"):
#   CONFIG_IP_VS               — the actual IPVS load-balancer subsystem
#     (distinct from the xt_ipvs match module above, which DOES ship);
#     docker's own check-config.sh buckets this under "Optional
#     Features"; only relevant to Docker Swarm mode service load-
#     balancing, which this appliance does not run.
#   CONFIG_VXLAN, CONFIG_MACVLAN, CONFIG_DUMMY — alternate/multi-host
#     network drivers (overlay networks, per-container MAC-addressed
#     interfaces, dummy test interfaces); docker's own check-config.sh
#     buckets these under "Network Drivers (Optional)". The default
#     bridge network this OS targets needs none of them; dockur/windows
#     itself can optionally run in macvlan mode for a LAN-visible IP, but
#     that is an advanced networking choice for a later wave if
#     requested, not this wave's baseline.
#   IPv6 netfilter family (IP6_NF_FILTER/MANGLE/TARGET_MASQUERADE/RAW/
#     NAT) and CONFIG_IP_NF_MANGLE / CONFIG_IP_NF_RAW — docker's own
#     check-config.sh buckets the IPv4 members of this group under
#     "Generally Necessary", but the version-matched, actively-maintained
#     yocto-6.18 cfg/docker.cfg (source (1) above, which ships a
#     kernel-6.18-specific fix this generic upstream script cannot know
#     about) omits all of them — trusted here as the narrower,
#     kernel-version-verified source. Docker's default bridge network is
#     IPv4-only (IPv6 networking is an explicit `--ipv6` opt-in docker
#     does not need for this OS's RemoteApp use case); mangle/raw tables
#     are not touched by dockerd's default filter+nat+masquerade rule
#     set.
#   CONFIG_CHECKPOINT_RESTORE, CONFIG_PROC_PID_CPUSET — present in
#     cfg/lxc.cfg (docker.scc's own include) but absent from docker's own
#     check-config.sh entirely; CRIU-based `docker checkpoint` is an
#     experimental feature this OS does not ship tooling for, and
#     PROC_PID_CPUSET is a cosmetic /proc entry, not a container-runtime
#     requirement.
#   CONFIG_DEVPTS_MULTIPLE_INSTANCES, CONFIG_NF_NAT_IPV4,
#     CONFIG_NF_NAT_NEEDED — named by docker's check-config.sh but
#     confirmed absent from this kernel's Kconfig entirely (not merely
#     disabled): these are pre-4.7-era symbols later removed/merged
#     (multi-instance devpts became the unconditional default; NF_NAT_*
#     variants merged into the single generic CONFIG_NF_NAT this fragment
#     already turns on) — not applicable to a 6.18 kernel, and their
#     absence from cfg/docker.cfg (source (1), which IS version-matched)
#     confirms this rather than contradicts it.
#
# Unscoped (both duduclaw-qemux86-64 and duduclaw-genericx86-64), same
# reasoning as duduclaw-binder.cfg / duduclaw-kvm.cfg in this directory:
# `docker compose up` for the Windows VM must work identically on the
# QEMU verification target (this wave's own acceptance criterion —
# "QEMU 開機 docker daemon 可起") and on real target hardware.
