# DuDuClaw OS journald hardening — WS-3/B2 (2026-09-01, DESIGN-os-
# security-line-2026-09.md §2 支柱二 B2: journald drop-in, "現況零配置").
#
# Storage=persistent: without this, journald defaults to Storage=auto,
# which only switches to disk-backed logging if /var/log/journal already
# exists (systemd's own tmpfiles.d ships that path as a `z` (adjust-if-
# exists) entry, NOT `d`/`D` (create) — confirmed by reading tmpfiles.d/
# systemd.conf.in directly at this line's pinned SRCREV, not assumed —
# so nothing creates it on a fresh image without this setting) and falls
# back to volatile /run/log/journal otherwise, meaning every boot loses
# its own log history at shutdown. `persistent` makes journald itself
# create /var/log/journal on first start (its own server_open_journal
# codepath, not tmpfiles) and keep using it from then on.
#
# SystemMaxUse=200M: bounds the persistent journal's own disk footprint —
# without a cap, an unbounded journal on a fixed-size root slot
# (DUDUCLAW_AB_SLOT_SIZE_MB=7168 on the QEMU dev/test calibration, see
# duduclaw-image-appliance.bb) could eventually starve the rest of the
# filesystem. 200M is a starting budget, not derived from a measured
# steady-state log volume on this line (no real long-running boot history
# exists yet to measure against) — revisit with real numbers once this
# line has production uptime.
#
# Seal=yes: Forward Secure Sealing (FSS) — enables `journalctl --verify`
# to detect tampering with journal files after the fact. Requires
# systemd's own gcrypt support, which this layer's recipes-core/systemd/
# systemd_%.bbappend now also turns on (same wave — checked: it was OFF
# before this ticket, `journalctl --setup-keys` would have failed with
# "Forward-secure sealing not available." otherwise). The actual sealing
# key is generated once, at first boot, by duduclaw-firstboot-provision.sh
# (recipes-duduclaw/duduclaw-firstboot/, same wave) — this drop-in only
# turns ON the feature; it does not itself generate any key material.
#
# FSS HONEST BOUNDARY (stating the security property precisely, not just
# turning the flag on and moving on): FSS detects tampering, it does NOT
# prevent it — an attacker with root can still delete/rewrite journal
# files outright (the guarantee is DETECTABILITY via `journalctl
# --verify --verify-key=<key>`, not immutability). It also cannot detect
# tampering with entries in the CURRENT, not-yet-sealed interval (the
# sealing key advances on a rolling interval — default 15 min, per
# journalctl's own `--interval=` documentation — so the most recent up-
# to-15-minutes of log data is never retroactively verifiable, only
# everything before the last seal rotation). And the verification key
# itself, while this drop-in and the firstboot script exist, is a
# "degraded protection until collected" story by design: as long as the
# key file also sits on the SAME machine (see duduclaw-firstboot-
# provision.sh's own comment on /data/duduclaw/journal-verify.key), an
# attacker with full local access to that machine has both halves needed
# to defeat the scheme (reseal or simply not worry about detection) —
# real protection requires an operator to physically remove that file to
# offline/out-of-band storage, which this ticket ships the mechanism for
# but cannot itself perform.
#
# NOT DONE IN THIS PASS, flagged rather than silently assumed complete:
# the design doc's own aspiration text for this item says "Storage=
# persistent（落 /data bind）" — binding /var/log/journal onto the
# durable /data partition so journal history survives an A/B slot switch
# (root gets replaced wholesale by an update; /data does not). Checked
# the boot-ordering feasibility before attempting it, not before shipping
# it: systemd-journald.service is DefaultDependencies=no / effectively
# Before=sysinit.target (it must be running to capture early boot
# messages), while /data's own mount unit (data.mount, a plain fstab
# entry) is only reached as part of local-fs.target — ordered AFTER
# sysinit.target on a standard boot. A naive bind-mount unit for
# /var/log/journal onto /data would therefore either race journald's own
# early startup (mounting after journald has already opened its journal
# files on root) or require restructuring journald's own start ordering
# — real design work, not a single-drop-in-file change, and not
# attempted here without a real boot to verify against (this ticket is
# recipe-only, no bitbake/QEMU run). Persistent storage today lands on
# root (survives a REBOOT, not an A/B slot switch/re-flash) — tracked as
# a P1 follow-up alongside B4's own retention-policy work, not silently
# claimed done.
[Journal]
Storage=persistent
SystemMaxUse=200M
Seal=yes
