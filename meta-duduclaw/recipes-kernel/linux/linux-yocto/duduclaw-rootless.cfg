# Rootless container stack + host loopback guard (2026-10-15, WP-O2).
#
# Needed by the desktop edition's rootless Podman (duduclaw-podman) and by
# the nftables rule duduclaw-podman.service loads at start. Unscoped (both
# machines), same reasoning as duduclaw-container.cfg. NOT yet confirmed
# against a built kernel: check /proc/config.gz on the first QEMU run
# (V8/V22 in wiki/eval/rootless-verification-2026-10.md); the kernel-cache
# audit warns about any line below that did not make it into .config.
#
# Loopback guard (podman-egress-guard: `socket cgroupv2 level 2 ...`):
#   CONFIG_NFT_SOCKET: the nf_tables `socket` expression. duduclaw-
#     nftables.cfg's header records that neither this layer nor the
#     yocto-kernel-cache netfilter baseline set any NFT_* symbol beyond
#     what the static ruleset uses, so this has to be turned on here.
#     Built in, so loading the rule never depends on module autoload.
#   CONFIG_CGROUP_BPF: selects SOCK_CGROUP_DATA (no prompt of its own),
#     which nft_socket needs to read a socket's cgroup v2 id; without it
#     the cgroupv2 key is compiled out. systemd wants CGROUP_BPF anyway.
CONFIG_NFT_SOCKET=y
CONFIG_CGROUP_BPF=y
#
# pasta (rootless networking) opens /dev/net/tun inside the user namespace.
# Built in rather than relying on a char-major autoload from that context.
CONFIG_TUN=y
#
# TIOCSTI only with CAP_SYS_ADMIN: root shells hand their terminal to
# uid-1000 CLIs (setpriv), whose children must not be able to type into the
# root shell. Also pinned at runtime by duduclaw-cli's 50-duduclaw-tiocsti.conf.
# CONFIG_LEGACY_TIOCSTI is not set
#
# netavark's nftables firewall driver (`--network bridge` inside the
# rootless network namespace): NAT/masquerade and fib lookups for port
# forwarding. Whether netavark can program these from a rootless netns on
# this image is open (V8); if it cannot, the platform switches the sandbox
# to pasta mode instead.
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_FIB_IPV4=m
CONFIG_NFT_FIB_IPV6=m
CONFIG_NFT_FIB_INET=m
CONFIG_NFT_REJECT=m
#
# The computer-use container's domain-filter.sh runs iptables inside the
# container (iptables-nft in the image): xtables matches/targets through
# nft_compat, the conntrack match and REJECT for both families.
CONFIG_NFT_COMPAT=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_IP_NF_TARGET_REJECT=m
CONFIG_IP6_NF_IPTABLES_LEGACY=m
CONFIG_IP6_NF_FILTER=m
CONFIG_IP6_NF_TARGET_REJECT=m
