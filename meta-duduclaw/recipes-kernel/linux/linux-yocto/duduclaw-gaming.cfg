# DuDuClaw OS — gaming-criteria six requirements (Y2-2, 2026-08-25).
#
# See duduclaw-n305.cfg header for the fragment mechanism. Citations are
# research/native-os-2026-08/kernel-self-maintain-2026-08.md §2.3 unless
# noted — that section is the direct reason this OS targets 6.18 rather
# than 6.12: ntsync is the one item on this list that genuinely requires
# the newer LTS, everything else here is either config-only (no version
# floor) or has no Kconfig knob at all.

# ntsync — Wine/Proton NT synchronization primitive emulation. Mainline
# since 6.14, so 6.12 could never have this regardless of config; this is
# the load-bearing reason for the 6.18 LTS choice. Module, matching how
# distros ship it (loaded on demand by Wine/Proton, not needed at boot).
CONFIG_NTSYNC=m

# 32-bit compatibility (CONFIG_IA32_EMULATION) — still upstream but many
# 2026-era distros default it OFF (reduced attack surface, e.g. openSUSE
# Leap 16.0). This is exactly the "explicit config decision, not a version
# floor" case the research report calls out as a concrete advantage of
# self-maintaining the kernel: we choose =y here for Proton's 32-bit
# Windows game compatibility rather than inheriting a distro's default-off
# policy shift by surprise.
CONFIG_IA32_EMULATION=y

# Controller HID — Xbox / PlayStation / Nintendo pads, all long-stable
# in-tree drivers with ongoing "new model support" patches (not "fix
# existing" patches), so no version risk from picking 6.18.
#
# Y2-3 (2026-08-25) config-audit fix: the two lines below were wrong/
# incomplete, caught by actually grepping the built genericx86-64 .config
# for these exact symbols and finding them absent (not even as a commented
# "# CONFIG_X is not set" line -- meaning Kconfig never made them visible
# at all, not just "off by default"):
#   - `CONFIG_HID_XPAD` does not exist as a Kconfig symbol in this kernel
#     tree at all (confirmed: zero matches anywhere under drivers/ Kconfig
#     files). The Xbox pad driver lives in the INPUT joystick subsystem, not
#     HID, despite handling a HID-class USB device -- real symbol is
#     `CONFIG_JOYSTICK_XPAD` (drivers/input/joystick/xpad.c, wired via
#     drivers/input/joystick/Kconfig's `config JOYSTICK_XPAD`).
#   - `CONFIG_HID_PLAYSTATION` does exist but `depends on
#     LEDS_CLASS_MULTICOLOR` (drivers/hid/Kconfig), which this fragment
#     never enabled -- without it the symbol has no unmet-dependency-free
#     path to =m and Kconfig hides it entirely.
#   - `CONFIG_JOYSTICK_XPAD` itself lives under `menuconfig INPUT_JOYSTICK`
#     (drivers/input/joystick/Kconfig) and `depends on USB_ARCH_HAS_HCD`.
#     USB_ARCH_HAS_HCD is a `def_bool y` already satisfied by this BSP, but
#     INPUT_JOYSTICK (the parent menuconfig bool) was never turned on --
#     same "parent framework gate" shape as the SND_SOC finding in
#     duduclaw-8845hs.cfg, caught the same way (re-ran `bitbake -c
#     kernel_configme -f linux-yocto` after the first attempted fix and
#     grepped the regenerated .config -- JOYSTICK_XPAD was STILL absent
#     even with the corrected symbol name, which is what led to checking
#     the menuconfig gate instead of assuming the rename alone was enough).
CONFIG_INPUT_JOYSTICK=y
CONFIG_JOYSTICK_XPAD=m
CONFIG_LEDS_CLASS_MULTICOLOR=y
CONFIG_HID_PLAYSTATION=m
CONFIG_HID_NINTENDO=m

# futex_waitv / fsync — mainline since 5.16 (2022), no Kconfig symbol at
# all (it is a syscall, always compiled in on x86_64). Documented here
# rather than silently omitted, so this fragment is a complete answer to
# "did you cover the six gaming requirements" rather than a partial one
# that looks complete by omission. Nothing to enable.
