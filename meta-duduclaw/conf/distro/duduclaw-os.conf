# DuDuClaw OS distro policy — Y1-1 bring-up milestone.
#
# Decisions this file encodes (see commercial/docs/MAP-agent-native-os-2026-08.md):
#   ② 更新引擎＝留 systemd-sysupdate 鏈 → INIT_MANAGER=systemd, EFI+systemd-boot
#   ③ app 承載＝Flatpak 為主 → DISTRO_FEATURES:append "polkit" (Y3-2), Flatpak/
#      bubblewrap/ostree/xdg-desktop-portal pulled from meta-oe (see below)
#   ④ gateway＝systemd 深綁留任 init → same INIT_MANAGER decision as ②
#
# Bring-up scope (Y1-1): boots to a login prompt under QEMU via a UKI +
# systemd-boot chain. Wayland DISTRO_FEATURE was deliberately NOT added at
# that point — comp/shell had no Yocto recipe yet (Y2-3 status). Y3-1
# (below) is the milestone that adds it, now that both recipes exist.

require conf/distro/poky.conf

# Y3-3 (2026-08-25), decision⑥ single-source-of-truth wiring: the numeric
# platform version lives in ONE place (duduclaw-platform-version.inc,
# machine-derived from the main repo's workspace Cargo.toml by
# `scripts/release.sh`) — DISTRO_VERSION below only appends the
# human-owned milestone suffix on top of it. The suffix itself
# ("-y1-bringup") is UNCHANGED by this wiring — still hand-owned by
# whoever tracks the Y-line milestones (see
# commercial/docs/TODO-agent-first-os-2026-08.md "Y 線"), not touched by
# release.sh, and NOT renamed here even though the Y-line has since moved
# past Y1 — renaming it is that milestone owner's call, not a release-
# engineering concern. Drop the suffix entirely (bare "${DUDUCLAW_PLATFORM_
# VERSION}") once the OS reaches its first GA release image.
require conf/distro/include/duduclaw-platform-version.inc

DISTRO = "duduclaw-os"
DISTRO_NAME = "DuDuClaw OS"
DISTRO_VERSION = "${DUDUCLAW_PLATFORM_VERSION}-y1-bringup"
DISTRO_CODENAME = "y1-bringup"
MAINTAINER = "DuDuClaw Engineering <engineering@duduclaw.internal>"

SDK_VENDOR = "-duduclawsdk"
SDK_VERSION = "${DISTRO_VERSION}"

# --- Decision ④: systemd deep-bound as init, not sysvinit -------------------
# Yocto's default init manager is SysVinit; systemd is OE-core first-class
# but opt-in. INIT_MANAGER is the modern (dev-manual §31) selector — it pulls
# in meta/conf/distro/include/init-manager-systemd.inc, which removes the
# sysvinit alternative providers automatically. Source:
# https://docs.yoctoproject.org/dev/dev-manual/init-manager.html
INIT_MANAGER = "systemd"

# --- Decision ② prerequisite: EFI + systemd-boot for the UKI/sysupdate chain
# appliance/'s existing WS2 update chain (sysupdate.d/*.transfer + bless-boot
# + sd-boot Type#2 boot-counting filenames) is systemd-boot specific — see
# research/native-os-2026-08/systemd-survival-2026-08.md §1. Bring-up target
# is QEMU OVMF (UEFI), so EFI must be a machine feature (set in the machine
# .conf files, not here) with systemd-boot as the bootloader provider.
PREFERRED_PROVIDER_virtual/bootloader = "systemd-boot"
EFI_PROVIDER = "systemd-boot"

# --- Flatpak carriage (decision ③) — Y3-2, 2026-08-25 ----------------------
# "polkit" is turned on for real now: flatpak, xdg-desktop-portal, and
# polkit's own recipe all declare REQUIRED_DISTRO_FEATURES = "polkit" (meta-
# openembedded/meta-oe, verified one-hand against the pinned commit — see
# kas/duduclaw-os.yml's pin-rationale comment) and silently fail
# `features_check` without it. "wayland" and "pam" stay OFF — this
# milestone only proves the Flatpak/bubblewrap/ostree/polkit chain and a
# dbus-run-session-wrapped Chromium kiosk launch under QEMU; comp/shell
# (which would actually need "wayland") have no Yocto recipe yet (Y2-3
# status), and nothing in this milestone's scope needs PAM-backed
# interactive auth — see recipes-duduclaw/duduclaw-polkit-flatpak/ for why
# (fail-closed group-gated rule, no polkit authentication-agent prompt
# involved). Left as a comment marker for whichever milestone adds them.
# DISTRO_FEATURES:append = " pam"
DISTRO_FEATURES:append = " polkit"

# --- "開機即殼" (decision ①/⑤) — Y3-1, 2026-08-25 --------------------------
# duduclaw-comp (smithay compositor) and duduclaw-shell (gpui client) both
# now have Yocto recipes (recipes-duduclaw/duduclaw-comp,
# recipes-duduclaw/duduclaw-shell) — this is the milestone the Y1-1/Y3-2
# comments above pointed at. Verified against
# openembedded-core/meta/recipes-graphics/mesa/mesa.bb's own PACKAGECONFIG
# conditionals (not guessed): with DISTRO_FEATURES as it stood before this
# line (no "opengl"/"wayland"/"vulkan"), mesa.bb's
# `${@bb.utils.contains('DISTRO_FEATURES', 'opengl', 'opengl egl gles gbm',
# '', d)}` and `${@bb.utils.contains_any('DISTRO_FEATURES', 'opengl
# vulkan', 'virtio', '', d)}` lines both evaluated to nothing — meaning
# mesa was building with NO gbm/egl/gles support and NO virtio-gpu gallium
# driver at all, which would have made both duduclaw-comp (needs
# libgbm.so/gbm.pc for its smithay `backend_gbm`+`backend_udev` features —
# gbm-sys's build.rs does a real pkg-config lookup, not just a header
# check) and duduclaw-shell (gpui_wgpu's EGL/GBM path under Wayland) fail
# at build time, not just at runtime. "vulkan" is added too:
# gpui_wgpu's wgpu backend prefers Vulkan when available (falls back to GL
# otherwise), and QEMU's virtio-gpu is the only GPU this milestone's QEMU
# verification target has — mesa.bb's VULKAN_DRIVERS_VIRTIO=",virtio"
# (-> the "gfxstream" Vulkan ICD) plus the PACKAGECONFIG[virtio] gallium
# driver only both get pulled in together via this one DISTRO_FEATURES
# change, not two separate ones.
DISTRO_FEATURES:append = " wayland opengl vulkan"

# rm_work is set per-build in kas/local_conf_header (build-time concern, not
# a distro policy), see meta-duduclaw/kas/duduclaw-os.yml.
