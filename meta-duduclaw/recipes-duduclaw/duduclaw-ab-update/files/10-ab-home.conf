# systemd drop-in for duduclaw-gateway.service (Y8-1, 2026-08-27).
#
# Points the gateway's DUDUCLAW_HOME at /data/duduclaw — the same path
# convention the Debian appliance line uses (that line's
# duduclaw-gateway.service sets Environment=DUDUCLAW_HOME=/data/duduclaw
# directly in the unit, ordered after duduclaw-data-migrate.service, neither
# of which exists on this Yocto line yet — see duduclaw-cli's own
# duduclaw-gateway.service header comment: "this Yocto image doesn't
# provision a non-root service user or a /data mount yet").
#
# WHY THIS MATTERS FOR THE A/B UPDATE CHAIN SPECIFICALLY: without this,
# `config.toml [os_update] staging_dir` (default <DUDUCLAW_HOME>/updates)
# would resolve to /root/.duduclaw/updates (root's real $HOME, since the
# gateway runs as root on this line with no DUDUCLAW_HOME set at all) — a
# path on the ROOT partition, which per this same design's own root-cause
# finding (see 10-duduclaw-root.transfer's own header) cannot hold a
# multi-hundred-MB-to-multi-GB root payload. This drop-in, plus the new
# /data partition this ticket's wks adds, makes DUDUCLAW_HOME resolve to
# EXACTLY the directory the two `.transfer` files in this same recipe
# hardcode as their `[Source] Path=` — the two must always agree, and a
# drop-in (rather than editing duduclaw-cli's own service file) keeps that
# agreement scoped to the one recipe (duduclaw-ab-update) that owns both
# halves, instead of splitting the fact across two recipes that would need
# to be kept in sync by convention alone.
#
# A drop-in, not a bbappend on duduclaw-cli's own unit file: this setting is
# this FEATURE's concern (A/B update staging), not duduclaw-cli's — the
# gateway binary itself has no opinion about where DUDUCLAW_HOME points,
# and a drop-in under
# /usr/lib/systemd/system/duduclaw-gateway.service.d/ layers cleanly on top
# without duplicating or overriding anything else duduclaw-cli's own unit
# already sets (DUDUCLAW_APPLIANCE=1 / DUDUCLAW_BIND=0.0.0.0 stay exactly as
# that recipe defines them).
[Service]
Environment=DUDUCLAW_HOME=/data/duduclaw
