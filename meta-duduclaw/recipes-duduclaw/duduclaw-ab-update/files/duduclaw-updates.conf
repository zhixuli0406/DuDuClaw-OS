# Root-owned staging directory for A/B updates (rootless gateway,
# 2026-10-15). duduclaw-sysd's SysupdateStageApply verb empties it, copies
# in only payloads whose SHA256SUMS signature verified, and runs
# systemd-sysupdate, whose .transfer files read from here. 0700 root: the
# gateway (uid 1000) and the AI employees sharing its uid cannot place or
# swap anything sysupdate will install. Installed only when the platform
# snapshot that implements the verb is vendored (see duduclaw-ab-update.bb).
#
# Type Path                    Mode UID  GID  Age Argument
d     /data/system            0755 root root -
d     /data/system/updates    0700 root root -
