# Root slot B — reserved empty, same size as slot A, no CopyFiles/Format.
#
# Left unformatted on purpose: systemd-sysupdate's partition target (see
# mkosi.extra/etc/sysupdate.d/10-duduclaw-root.conf) writes a raw
# filesystem image straight into this partition with `dd`-equivalent
# semantics — there's no mkfs step at update time, so pre-formatting here
# would just be discarded.
#
# Pre-allocating this slot at build/install time (instead of relying on
# systemd-sysupdate to grow the partition table on first update) is the
# more conservative choice for a scaffold: it doesn't depend on verifying
# sysupdate's on-demand-partition-creation behavior for the partition
# target type, which this round did not independently confirm — see
# appliance/README.md "known open points".
# NoAuto=yes is LOAD-BEARING (2026-08-18): both root-a and root-b are
# Type=root (→ root-arm64), so systemd's gpt-auto-generator sees TWO
# candidate root partitions and its choice is ambiguous — it picked this
# empty slot and boot failed to mount (status=32, dropped to emergency).
# NoAuto sets the GPT "no-auto" attribute so the discoverable-partitions
# root autodiscovery skips slot B entirely, leaving slot A the only
# candidate on a fresh boot.
#
# H3a (2026-08-23) demoted this from load-bearing to belt-and-braces: the
# UKI now carries an explicit `root=PARTUUID=`, so gpt-auto no longer picks
# the root at all and cannot be confused by two candidates. NoAuto stays as
# the factory initial state anyway — it costs nothing and keeps the empty
# slot un-mountable by accident.
#
# Clearing it after an update is no longer deferred: the sysupdate transfer
# (mkosi.extra/etc/sysupdate.d/10-duduclaw-root.transfer) sets
# `PartitionNoAuto=0` so whichever slot sysupdate writes comes out with the
# same attribute set as slot A. Live-fire verified on a scratch GPT: slot B
# went from attr 0x9000000000000000 (no-auto + read-only) to
# 0x0800000000000000 — byte-identical to slot A — after one real
# `systemd-sysupdate update`.
[Partition]
Type=root
# `_empty` is not a name, it is systemd-sysupdate's reserved marker for "this
# slot is free, write here" (H3a, 2026-08-23). Without it sysupdate sees no
# writable slot and refuses to install, and with a version-shaped label it
# would instead believe some version is already installed here. Live-fire
# verified before the image was rebuilt: a scratch GPT with slot A labelled
# `duduclaw-os_0.1.0` and slot B `_empty`, updated with a real
# `systemd-sysupdate update`, wrote the payload into slot B and relabelled it
# `duduclaw-os_0.2.0`, after which `list` reported 0.2.0 current / 0.1.0
# installed.
#
# It also sorts correctly if anything ever does compare labels: `_` (0x5F) <
# `d` (0x64), so `_empty` always loses to a `duduclaw-os_*` label under
# strverscmp_improved. The old `duduclaw-root-b` did the opposite — it sorted
# ABOVE slot A's `duduclaw-root-a`, making the empty slot gpt-auto's
# preferred root.
Label=_empty
# 4G -> 5G (2026-08-20, Shell-S2 kiosk wave): the gpui-shell kiosk additions
# (mesa-vulkan-drivers incl. libLLVM, fonts-noto-cjk, fonts-noto-color-emoji,
# login, the duduclaw-shell binary) overflowed the 4G root at mkfs populate
# time ("No space left on device while populating file system"). Clean root
# was ~3.0G; the additions are ~0.6G. Both root partitions move together —
# A/B slots must stay identical for sysupdate.
SizeMinBytes=5G
SizeMaxBytes=5G
ReadOnly=yes
NoAuto=yes
