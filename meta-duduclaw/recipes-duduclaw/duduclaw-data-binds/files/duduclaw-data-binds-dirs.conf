# DuDuClaw OS — bind-mount SOURCE directories on /data (VER-RO, 2026-09-02).
#
# Authority: commercial/docs/DESIGN-os-trust-chain-2026-09.md "依賴鏈補記"
# (2026-09-02) — dm-verity requires a read-only root; every unit that
# currently writes under root's /var must instead write onto the durable
# /data partition. This tmpfiles.d file creates the /data-side directories
# each var-*.mount unit in this same recipe binds onto its own /var/<x>
# mountpoint.
#
# WHY tmpfiles.d, not a hand-rolled oneshot .service (ported pattern, not
# invented): this mirrors the already-QEMU-verified Debian appliance line's
# own var-lib-iwd.mount + duduclaw-network.conf pair
# (appliance/mkosi.extra/usr/lib/tmpfiles.d/duduclaw-network.conf's own
# header has the full reasoning) — ".mount units cannot create their own
# source directory", and systemd-tmpfiles-setup.service's OWN default
# ordering (After=local-fs.target, Before=sysinit.target) is exactly
# "after /data is mounted, before the var-*.mount units below (which order
# themselves Before= their consuming .service) are needed" — no custom
# service, no new ordering primitive, reuses a systemd-native mechanism
# already proven on this project's other OS line. Idempotent (`d` = create
# if missing, fix perms if present) on every boot, so an operator deleting
# one of these directories self-heals on the next boot instead of leaving a
# service permanently broken.
#
# Ownership matches what each consumer already expects on its own /var/<x>
# path today (checked against each upstream unit/build source, not
# guessed — see this recipe's own duduclaw-data-binds.bb header for the
# one-hand evidence trail):
#   log:     root:root 0755 — the whole /var/log tree (round 2: bind
#            target widened from journal/ to /var/log, see var-log.mount's
#            own header). journald creates its own journal/ subdirectory
#            (2755 root:systemd-journal) underneath at runtime. NOTE this
#            entry is the self-heal path only — first-boot CREATION is
#            duduclaw-data-binds-early.service's job, because the journald
#            chain cannot wait for tmpfiles-setup (ordering cycle, see
#            that unit's header).
#   iwd:     root:root 0700 — matches the Debian line's own
#            duduclaw-network.conf entry for /data/network/iwd verbatim
#            (iwd stores Wi-Fi passphrases in CLEARTEXT; 0700 root-only is
#            load-bearing, not cosmetic).
#   docker:  root:root 0711 — dockerd's own default umask/chmod on
#            /var/lib/docker; harmless if dockerd re-tightens it on first
#            start (bind mount, not a fresh mkfs, so dockerd sees an empty
#            writable directory exactly as it would on a fresh install).
#   waydroid: root:root 0755 — waydroid's own tools/config/__init__.py
#            "work" dir has no special mode requirement (its own
#            sub-trees — lxc/, images/, data/ — are created and permission-
#            managed by the waydroid CLI itself on first `waydroid init`).
#
# Type  Path                    Mode  UID   GID              Age  Argument
d       /data/system            0755  root  root             -
d       /data/system/log        0755  root  root             -
d       /data/system/iwd        0700  root  root             -
d       /data/system/docker     0711  root  root             -
d       /data/system/waydroid   0755  root  root             -
