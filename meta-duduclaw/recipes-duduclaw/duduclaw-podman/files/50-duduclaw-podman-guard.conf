# nftables.service drop-in, shipped by duduclaw-podman (2026-10-15).
#
# nftables.conf starts with `flush ruleset`, so every (re)load empties the
# duduclaw_podman_egress chain that duduclaw-podman.service filled. Since
# the first real-image run (F6) a firewall reload or restart no longer
# restarts the podman unit (no PartOf=/Requires= on nftables.service), so
# running containers stay up across it, and this drop-in is what puts the
# rule back: right after the ruleset loads, inside the same nftables.service
# job. That shrinks the unguarded window to the moment between `flush
# ruleset` and this line; it does not remove it. A bare `nft -f` by hand
# leaves the chain empty until the podman unit restarts; use systemctl.
#
# --if-present: before Podman has ever started (the normal case at boot,
# when this unit runs in sysinit) there is no cgroup to guard and the guard
# exits 0. If Podman runs and the rule cannot be loaded, the guard stops
# duduclaw-podman.service (and with it every container) and fails, so
# nftables.service shows failed too. Fail closed: no container keeps
# running without the guard.
[Service]
ExecStartPost=/usr/libexec/duduclaw/podman-egress-guard --if-present
ExecReload=/usr/libexec/duduclaw/podman-egress-guard --if-present
