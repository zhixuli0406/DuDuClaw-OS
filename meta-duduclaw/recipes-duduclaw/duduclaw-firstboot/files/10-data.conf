# DuDuClaw OS gateway -- /data wiring drop-in (Y9-1, 2026-08-27).
#
# LOCATION CONVENTION (matches Y8-1's own precedent, checked before
# picking a path -- not independently invented): Y8-1's
# recipes-duduclaw/duduclaw-ab-update/files/10-ab-home.conf already
# ships an almost-identical drop-in (same Environment=DUDUCLAW_HOME=
# /data/duduclaw line) at ${systemd_system_unitdir}/duduclaw-gateway.
# service.d/ -- this file lives at the SAME directory, under a
# DIFFERENT filename (10-data.conf, not 10-ab-home.conf), so the two
# never collide as files (only a shared parent directory, which is
# ordinary and expected -- many unrelated packages share a directory).
# The two drop-ins are also never installed on the same image:
# duduclaw-ab-update only ships on duduclaw-image-ab.bb (require
# duduclaw-image.bb directly), duduclaw-firstboot only ships on
# duduclaw-image-data.bb and its descendants (duduclaw-image-flatpak.bb
# as of this ticket) -- see duduclaw-image-data.bb's own header for why
# those two image chains are deliberately kept separate this round.
#
# WHY A DROP-IN, NOT AN EDIT TO duduclaw-gateway.service ITSELF: that base
# unit (recipes-duduclaw/duduclaw-cli/files/duduclaw-gateway.service) is
# shared, unmodified, by every image that installs duduclaw-cli --
# duduclaw-image.bb, duduclaw-image-flatpak.bb (before this ticket) AND
# duduclaw-image-ab.bb, none of which install THIS recipe
# (duduclaw-firstboot) or carry a duduclaw-firstboot-provision.service unit
# at all. Adding `Requires=duduclaw-firstboot-provision.service` directly
# into the base unit would make the gateway fail to start on every image
# that doesn't also ship this recipe -- systemd cannot satisfy a Requires=
# on a unit whose .service file does not exist, and that failure DOES
# propagate to units that Requires= it (unlike a merely-unresolvable
# Wants=). A systemd unit drop-in (systemd.unit(5) ".d/" override
# directories) layers this ordering/env on top ONLY on images that also
# install this recipe, leaving the base file and every other image's boot
# chain byte-for-byte untouched -- same "additive, never mutate a verified
# path" discipline this layer already uses at the image-recipe level
# (duduclaw-image-ab.bb `require`s rather than edits duduclaw-image.bb, for
# an analogous reason).
#
# Requires=/After=: mirrors the Debian appliance line's own
# duduclaw-gateway.service (After=...duduclaw-firstboot-provision.service
# duduclaw-data-migrate.service, Requires=duduclaw-firstboot-provision.service)
# -- ordering-only for the migrator (a failed migration must never block
# the gateway, see duduclaw-data-migrate.service's own header), hard
# dependency on provisioning (a gateway that starts before /data/duduclaw
# even exists has nowhere durable to persist anything).
#
# Environment=DUDUCLAW_HOME=/data/duduclaw: without this, the gateway
# (running as root today, no Environment=DUDUCLAW_HOME= in the base unit)
# falls back to its own default of `$HOME/.duduclaw` -- root's home
# directory, which lives on the SAME root partition this line rebuilds on
# every image update, i.e. exactly the config-loss failure mode this whole
# ticket exists to close. This one line is what actually makes every other
# piece of /data provisioning in this ticket reachable by the running
# gateway process, not merely present on disk.
[Unit]
After=duduclaw-firstboot-provision.service duduclaw-data-migrate.service
Requires=duduclaw-firstboot-provision.service

[Service]
Environment=DUDUCLAW_HOME=/data/duduclaw
