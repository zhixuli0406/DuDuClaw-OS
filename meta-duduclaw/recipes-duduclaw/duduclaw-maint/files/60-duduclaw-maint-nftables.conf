# nftables.service drop-in, shipped by duduclaw-maint (2026-10-16).
#
# Authority: commercial/docs/DESIGN-maintenance-ssh-account-2026-10.md
# (private platform tree) section 5.3. Fills the duduclaw_maint_egress
# chain that nftables.conf leaves empty and jumps to for loopback output:
# the maintenance SSH account (uid 4800) may not open connections to
# services on the device itself.
#
# Numeric uid, never the account name: nft resolves a name when the rule is
# loaded, and a name it cannot resolve fails the command. Keeping the rule
# out of nftables.conf means even that failure could only lose this rule,
# never the whole ruleset.
#
# Named 60- so it runs after duduclaw-podman's 50- drop-in and cannot keep
# the podman guard from being re-added. The leading "-" makes a failure of
# this command not fail nftables.service; a missing rule is caught by
# duduclaw-sysd, which checks for the rule and the jump before it opens a
# window and refuses otherwise. If an earlier ExecStartPost fails, systemd
# skips this one and does not run ExecStop (`nft flush ruleset`), so the
# loaded ruleset stays.
#
# ExecReload: nftables.conf starts with `flush ruleset`, so every reload
# empties the chain and this line adds the rule back in the same job. A bare
# `nft -f /etc/nftables.conf` by hand leaves it empty; use systemctl.
[Service]
ExecStartPost=-/usr/sbin/nft add rule inet filter duduclaw_maint_egress meta skuid 4800 counter reject
ExecReload=-/usr/sbin/nft add rule inet filter duduclaw_maint_egress meta skuid 4800 counter reject
