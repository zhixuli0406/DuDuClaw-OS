#@TYPE: Machine
#@NAME: DuDuClaw QEMU x86-64 (Y1 dev/test machine)
#@DESCRIPTION: Thin wrapper around oe-core's qemux86-64 for QEMU-based
# bring-up and CI smoke testing. This is NOT the real-hardware target — see
# duduclaw-genericx86-64.conf for that. Kept as a separate machine (not just
# a MACHINE=qemux86-64 override at build time) so QEMU-only overrides
# (serial console for headless boot verification) never leak into the
# real-hardware machine definition, and so `bitbake-layers show-appends`/
# recipe overrides can target "duduclaw-qemux86-64" specifically later.

require conf/machine/qemux86-64.conf

MACHINEOVERRIDES =. "duduclaw-qemux86-64:"

# Machine-name aliasing, kernel-BSP half — the linux-yocto_6.18.bbappend
# COMPATIBLE_MACHINE fix (recipes-kernel/linux/) only got the recipe to
# accept this machine at all; kernel-yocto.bbclass separately does its own
# BSP-definition lookup keyed on KMACHINE (default `${MACHINE}`, per
# meta/classes-recipe/kernel-yocto.bbclass:19), which fails outright for an
# unknown machine name with "Could not locate BSP definition for
# duduclaw-qemux86-64/standard" — discovered when do_kernel_metadata failed
# on the first successful pass through the COMPATIBLE_MACHINE gate. Pinning
# KMACHINE back to the upstream name reuses qemux86-64's existing BSP/
# kernel-branch metadata verbatim.
KMACHINE = "qemux86-64"

# Headless serial console — the Y1-1 PASS criterion is a login prompt
# captured from the QEMU serial log (`runqemu nographic`), not a GTK window.
SERIAL_CONSOLES = "115200;ttyS0"

# --- UKI + systemd-boot under QEMU/OVMF ------------------------------------
# qemux86-64's stock MACHINE_FEATURES is just "x86 pci" (verified against
# the pinned oe-core commit, meta/conf/machine/qemux86-64.conf) — efi is not
# on by default and must be added explicitly for uki.bbclass + systemd-boot.
MACHINE_FEATURES:append = " efi"

# The kernel lives inside the signed UKI, not as a separate runqemu -kernel
# load — both of these plus QEMU_USE_KVM="" are lifted verbatim from
# oe-core's own CI selftest for this exact scenario
# (meta/lib/oeqa/selftest/cases/uki.py test_uki_boot_systemd, pinned commit
# 5d1aa5c8...). KVM is disabled there with the comment "disable kvm, breaks
# boot" — irrelevant here anyway since the arm64 (Apple Silicon) Docker
# Desktop host has no x86 KVM to offer; TCG software emulation is the only
# option, so this just documents that fact rather than changing anything.
QB_KERNEL_ROOT = ""
QB_DEFAULT_KERNEL = "none"
QEMU_USE_KVM = ""
