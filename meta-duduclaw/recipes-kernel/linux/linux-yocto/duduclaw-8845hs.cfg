# DuDuClaw OS — AMD 8845HS (Phoenix) driver fragment (Y2-2, 2026-08-25).
#
# See duduclaw-n305.cfg header for the fragment mechanism (.cfg, no .scc
# needed) and the "explicit overlay on a working baseline" rationale.
# Citations are research/native-os-2026-08/kernel-self-maintain-2026-08.md
# §2.2 unless noted.

# Display/graphics — amdgpu has had base Phoenix support since its launch;
# DRM_AMD_DC is the AMD Display Core stack needed for actual display output
# (not just headless compute) — built-in (=y) rather than module because
# early-KMS display bring-up wants the driver available before userspace
# can load a module, matching how DRM_AMD_DC ships on most distros.
# Suspend/resume for Phoenix was still seeing active upstream backport
# activity as of the research date (§2.2) — not something a config
# fragment can fix, tracked as a real-hardware verification item, not a
# config gap.
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMD_DC=y

# Wired network — r8169 (in-tree) has RTL8125 (2.5GbE) support merged, but
# community reports suggest it's less mature than Realtek's own out-of-tree
# r8125 (§2.2, unconfirmed exact merge version/stability). Starting with
# in-tree r8169 per the "no out-of-tree/DKMS unless proven necessary"
# default from the kernel research report's CVE-cost argument (§3.2) — a
# DKMS r8125 module is a real-hardware follow-up if r8169 proves
# insufficient, not a config-fragment concern.
CONFIG_R8169=m

# Wi-Fi — "mt7921 系" per the task: mt7921e covers the mt7921/mt7922
# generation, mt7925e covers the newer Wi-Fi 7-class mt7925 (mainline since
# 6.7, well within our 6.18 baseline). MT7927 (also seen on some 8845HS
# mini PCs) has NO upstream driver as of the research date regardless of
# kernel version or config — not something this fragment can address; see
# the honest gap note in duduclaw-genericx86-64.conf's firmware comment.
CONFIG_MT7921E=m
CONFIG_MT7925E=m

# Audio — HDA for the codec side, ACP (Audio CoProcessor) for Phoenix's
# integrated DSP path.
#
# Y2-3 (2026-08-25) config-audit fix: `CONFIG_SND_SOC_AMD_ACP` alone was
# silently absent from the built .config -- not disabled, entirely invisible
# to Kconfig (no commented "is not set" line either). Root cause confirmed
# by reading sound/soc/amd/Kconfig directly: SND_SOC_AMD_ACP itself has no
# `depends on` line, but it lives inside the ALSA SoC (System-on-Chip audio
# framework) Kconfig subtree, whose top-level `CONFIG_SND_SOC` was never
# enabled by this fragment (or by the common-pc-64 BSP baseline) -- without
# the parent framework on, none of its children are reachable regardless of
# what a leaf .cfg fragment requests.
CONFIG_SND_SOC=y
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_SOC_AMD_ACP=m
