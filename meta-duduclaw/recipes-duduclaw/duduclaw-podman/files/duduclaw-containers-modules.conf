# Kernel modules for the rootless container stack (2026-10-15).
# PROVISIONAL: the list is derived from the kernel options this layer turns
# on (duduclaw-container.cfg, duduclaw-rootless.cfg) and from what netavark
# (nftables driver) and the computer-use container's domain-filter.sh
# (iptables-nft in the container: conntrack match, REJECT) use. It has not
# been measured on a real image yet; confirm with an lsmod diff during the
# QEMU run (V8 in wiki/eval/rootless-verification-2026-10.md) and drop
# anything that turns out to be built in or unused.
#
# Preloaded because autoloading from inside a rootless user namespace is
# not something to rely on. Only modules this layer itself configures as
# =m are listed: systemd-modules-load fails (and the unit shows failed) on
# a name the kernel does not have.
tun
nft_nat
nft_masq
nft_fib_inet
nft_compat
xt_conntrack
ip_tables
iptable_filter
iptable_nat
xt_MASQUERADE
xt_addrtype
